# Primary Mosquitto broker for this L0 instance (the "server process").
# Hosts the site's own EVerest internal traffic (everest/ prefix) and the
# external_energy_node_API server module. mqtt-external bridges into this
# broker — see mosquitto-external.conf.
#
# The bridge below is a SEPARATE, optional uplink: it lets this L0's
# external_energy_node_API server module be reached by a higher-tier L1
# broker, so a supervisory EnergyManager above multiple L0 sites can send
# enforce_limits down and receive energy_flow_request up from each site.
# Disabled by default — uncomment and fill in L1_HOST and the server_id
# below to opt this L0 instance into an L1 hierarchy.

listener 1883
listener 9001
protocol websockets
allow_anonymous true

# Persistence off for SIL — clean state on restart
persistence false

# Logging
log_type error
log_type warning
log_type notice

# ── Optional uplink bridge to a shared L1 broker ───────────────────────────
# Replace L1_HOST with the L1 broker's reachable address (LAN/VPN IP or
# hostname — NOT a docker-compose service name, since L1 is a separate
# machine). Replace SERVER_ID with this L0's own external_energy_node_API
# module id (e.g. server_m0_api, matching the id used in this site's
# EVerest config) — narrowing to only this L0's own subtree keeps sites
# from seeing each other's enforce_limits/energy_flow_request traffic once
# multiple L0s share one L1.
#
# QoS 1 (not 0): enforce_limits and energy_flow_request in flight must
# survive a bridge reconnect — see mosquitto-external.conf for why.
#
connection l1_bridge
address <your client ip:1883>
bridge_attempt_unsubscribe false
topic everest_api/1/external_energy_node/external_energy_node/# both 1
