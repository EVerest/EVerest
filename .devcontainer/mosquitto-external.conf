# Secondary Mosquitto broker for cross-process energy_grid communication.
# Run it via the mqtt-external service in docker-compose.yml (host port 1884).
# A second EVerest process (the external EnergyManager, running
# external_energy_node_client_API) uses this as its primary MQTT broker; a
# bridge forwards the external_energy_node API topics bidirectionally to/from
# the server process's primary broker (mqtt-server).
#
# Never point two EVerest processes at ONE broker instead: both use the
# everest/ internal prefix, so instance A's everest/ready (a global ready
# signal) would fire ready() on instance B's modules, and both managers would
# answer the same everest/config/request.

listener 1883
allow_anonymous true

# Persistence off for SIL — clean state on restart
persistence false

# Logging
log_type error
log_type warning
log_type notice

# ── Bridge to server-process primary Mosquitto broker ─────────────────────
# Forwards ApiHelper topics bidirectionally so that:
#   external_energy_node_API (server process, mqtt-server:1883) can reach
#   external_energy_node_client_API (external manager, mqtt-external:1883)
#   and vice versa.
#
# Topic convention (ApiHelper):
#   everest_api/1/external_energy_node/{server_id}/e2m/energy_flow_request
#     — server → external mgr (server publishes, client subscribes)
#   everest_api/1/external_energy_node/{server_id}/m2e/enforce_limits
#     — external mgr → server (client publishes, server subscribes)
#   everest_api/1/external_energy_node/{server_id}/e2m/heartbeat
#   everest_api/1/external_energy_node/{server_id}/e2m/communication_check
#     — ApiHelper infrastructure topics
#
# Direction "both" means: publish on either broker is forwarded to the other.
#
# Deliberately narrowed to the external_energy_node module namespace: bridging
# all of everest_api/# would also bridge the non-module-scoped entrypoint
# namespace, so both instances would publish everest_api/ready_beacon and both
# would answer a single everest_api/discover.
#
# QoS 1 (not 0): enforce_limits and energy_flow_request in flight must survive
# a bridge reconnect — with QoS 0 they are silently dropped, and on the server
# side a silent gap flips control back to the internal EnergyManager.
connection server_bridge
address mqtt-server:1883
bridge_attempt_unsubscribe false
topic everest_api/1/external_energy_node/# both 1
# To bridge only specific servers instead of every external_energy_node
# instance, replace the line above with one line per server id:
# topic everest_api/1/external_energy_node/server_m0_api/# both 1
# topic everest_api/1/external_energy_node/server_m1_api/# both 1
