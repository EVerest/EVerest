description: PN532 RFID/NFC token provider returning the token as soon as the tag can be read by the reader
provides:
  main:
    description: Implementation of PN532 RFID/NFC token provider
    interface: auth_token_provider
    config:
      serial_port:
        description: Serial port the PN532 hardware is connected to
        type: string
        default: /dev/ttyS0
      baud_rate:
        description: Serial baud rate to use when communicating with PN532 hardware
        type: integer
        minimum: 9600
        maximum: 230400
        default: 115200
      read_timeout:
        description: Time between subsequent card reads (in s)
        type: integer
        minimum: 0
        maximum: 120
        default: 1
      token_debounce_interval_ms:
        description: >-
          Time in ms a card must stay out of reach of the reader before its token is published again (debounce
          interval). A card held on the reader is published only once. Must be greater than read_timeout to have
          an effect. 0 disables debouncing.
        type: integer
        minimum: 0
        maximum: 10000
        default: 2000
      debug:
        description: Show debug output on command line.
        type: boolean
        default: false
