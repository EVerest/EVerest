description: Payment terminal module for Feig devices.
config:
  ip:
    description: IP Address of Feig terminal, like "192.168.0.1"
    type: string
  feig_serial:
    description: >-
      Serial of Feig terminal. Typically a seven characters long string like
      "ABCD123".
    type: string
  terminal_id:
    description: Payment terminal ID.
    type: string
  currency:
    description: Currency in ISO 4217 format.
    default: 978
    type: integer
  pre_authorization_amount:
    description: Pre authentication amount in Cents.
    default: 2500
    type: integer
  read_card_timeout:
    description: The time (is seconds) to wait for a card to be read.
    default: 2
    type: integer
  read_card_debounce:
    description: >-
      The debounce time (in seconds) after a successful card reading. The
      parameter prevents re-reading the same card.
    default: 2
    type: integer
  read_card_control:
    description: >-
      The ZVT card reading control (Tlv tag 0x1f15) used when polling for
      cards. The default 208 (0xd0) detects cards without sending commands to
      them; the token of a bank card is then taken from the
      `bank_session_token` interface. The value 192 (0xc0) fully reads the
      card: slower, but the token is then derived from the physical card,
      which allows stopping a session by presenting the same card again. With
      192 the `bank_session_token` interface is not used and the caller of
      `token_validator` must deliver the invoice token in `parent_id_token` -
      validation is rejected otherwise.
    default: 208
    type: integer
  transactions_max_num:
    description: >-
      The maximum number of concurrent transactions. The Feig terminal will
      reject a transaction if it would exceed the maximum number of concurrent
      transactions - in this case you need to finish a transaction to allow a
      new one.
    default: 1
    type: integer
  password:
    description: Password for the Feig terminal.
    type: integer
  end_of_day_max_interval:
    description: >-
      The maximum time (in sec) between end of day jobs. Payment backends might
      force the payment terminals to run them regularly. Defaults to one day.
    default: 86400
    type: integer
requires:
    session:
      interface: session_cost
      min_connections: 0
      max_connections: 1
      ignore:
        vars:
          - default_price
    bank_session_token:
      interface: bank_session_token_provider
      min_connections: 0
      max_connections: 1
provides:
  token_provider:
    interface: auth_token_provider
    description: Provides an authentication token from the Feig terminal.
  token_validator:
    interface: auth_token_validator
    description: >-
      Reserves the `pre_authorization_amount` from a bank card. The caller may
      deliver the invoice token in the `parent_id_token` field of the provided
      token; if unset, the token id itself is used as the invoice token.
  payment_terminal:
    interface: payment_terminal
    description: Provides all the commands specific for bank cards handling
enable_external_mqtt: false
metadata:
  license: https://opensource.org/licenses/Apache-2.0
  authors:
    - embedded-team@qwello.eu
