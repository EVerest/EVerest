description: Interactive bring up helper for EV-side SLAC interface
config:
  echo_device:
    description: >-
      Network device for the link echo test (raw ethernet ping/pong over EtherType 0x88B5,
      proving payload actually crosses the SPE link - IP traffic between two taps on one host is
      short-circuited by local routing and never touches the wire). Empty disables the echo
      section. Needs CAP_NET_RAW: run the panel under sudo, like the daemon.
    type: string
    default: cb_plc_ev
requires:
  slac:
    interface: ev_slac
