description: >-
  ISO 15118 EV-side (EVCC) implementation built on the libiso15118 ev::Controller
  (SIL alternative to PyEvJosev).
config:
  device:
    description: Ethernet device used for HLC.
    type: string
    default: eth0
  evcc_id:
    description:
      EVCC identifier sent to the SECC in ISO 15118-20 SessionSetup, 1 to 255 characters.
      Both forms are valid, a MAC address (02:00:00:00:00:01) and a vehicle identifier
      (WMIV1234567890ABCDEX). ISO 15118-2 and DIN SPEC 70121 do not use it; their EVCCID
      is the 6 byte MAC of `device`.
    type: string
    minLength: 1
    default: "02:00:00:00:00:01"
  response_timeout_ms:
    description:
      Response watchdog timeout in milliseconds. 0 uses the per-message ISO 15118
      timeouts from the specification table.
    type: integer
    minimum: 0
    default: 0
  d20_control_mode:
    description:
      Preferred ISO 15118-20 charge-loop control mode. The EV selects the SECC
      parameter set matching this preference and falls back to the first offered
      set when the preference is not offered.
    type: string
    enum:
      - Scheduled
      - Dynamic
    default: Dynamic
  supported_DIN70121:
    description:
      Offer DIN SPEC 70121 (DC, plaintext only) in the SAP handshake, after ISO 15118-20.
    type: boolean
    default: false
  supported_ISO15118_2:
    description:
      Offer ISO 15118-2 (AC and DC, EIM or Plug&Charge, TLS 1.2 or plaintext) in the
      SAP handshake, after ISO 15118-20.
    type: boolean
    default: false
  tls_active:
    description: Request TLS in the SDP request and connect with TLS when the SECC offers it.
    type: boolean
    default: false
  enforce_tls:
    description:
      Reject an SDP response that does not offer TLS (no plaintext downgrade).
      Takes precedence over tls_active and always implies a TLS connection.
    type: boolean
    default: false
  enable_tls_1_3:
    description:
      Use TLS 1.3 with a client certificate (ISO 15118-20). False uses TLS 1.2
      without a client certificate (ISO 15118-2).
    type: boolean
    default: false
  verify_server_certificate:
    description: Verify the SECC certificate chain against the V2G root.
    type: boolean
    default: true
  enable_tls_key_logging:
    description:
      Export the TLS session keys (pre-master-secret) of the handshake. For
      testing and simulation only.
    type: boolean
    default: false
  tls_key_logging_path:
    description: Output directory for the TLS key log file.
    type: string
    default: /tmp
  v2g_root_cert_path:
    description:
      Path to the V2G root certificate. Empty resolves to
      <etc>/certs/ca/v2g/V2G_ROOT_CA.pem.
    type: string
    default: ""
  device_cert_chain_path:
    description:
      Path to the vehicle (TLS client) certificate chain, leaf first. Empty resolves
      to <etc>/certs/client/vehicle/VEHICLE_CERT_CHAIN.pem.
    type: string
    default: ""
  device_key_path:
    description:
      Path to the vehicle leaf private key. Empty resolves to
      <etc>/certs/client/vehicle/VEHICLE_LEAF.key.
    type: string
    default: ""
  device_key_password_path:
    description:
      Path to the file holding the password of the vehicle leaf private key. Empty
      resolves to <etc>/certs/client/vehicle/VEHICLE_LEAF_PASSWORD.txt; a missing or
      empty file means no password.
    type: string
    default: ""
  iso2_ac_e_amount_wh:
    description:
      ISO 15118-2 AC_EVChargeParameter EAmount, the energy the EV asks for, in watt-hours.
      The -20 AC parameters below are power based and do not carry this value.
    type: number
    minimum: 0
    default: 60000
  iso2_ac_ev_max_voltage_v:
    description: ISO 15118-2 AC_EVChargeParameter EVMaxVoltage in volts (per line).
    type: number
    minimum: 0
    default: 400
  iso2_ac_ev_max_current_a:
    description: ISO 15118-2 AC_EVChargeParameter EVMaxCurrent in amperes (per line).
    type: number
    minimum: 0
    default: 32
  iso2_ac_ev_min_current_a:
    description: ISO 15118-2 AC_EVChargeParameter EVMinCurrent in amperes (per line).
    type: number
    minimum: 0
    default: 10
  enable_pnc:
    description:
      Offer ISO 15118-2 Plug&Charge (Contract) next to EIM and select Contract whenever the
      SECC offers it. Requires TLS; without it the EV falls back to EIM only. This is
      config driven because EvManager's default payment option is `auto`; an explicit
      ExternalPayment in start_charging turns the preference off for that session, and an
      explicit Contract keeps it on. The contract certificate material below is used for
      PaymentDetails and, when it is missing or pnc_force_cert_install is set, for a
      CertificateInstallation.
    type: boolean
    default: false
  pnc_contract_cert_chain_path:
    description:
      Path to one PEM file holding the whole PnC contract (MO) certificate chain, leaf first.
      Empty resolves to <etc>/certs/client/mo/MO_LEAF.pem followed by
      <etc>/certs/ca/mo/INTERMEDIATE_MO_CA_CERTS.pem.
    type: string
    default: ""
  pnc_contract_key_path:
    description:
      Path to the PnC contract (MO) leaf private key (PEM); signs the PnC AuthorizationReq.
      Empty resolves to <etc>/certs/client/mo/MO_LEAF.key.
    type: string
    default: ""
  pnc_contract_key_password_path:
    description:
      Path to the file holding the password of the contract leaf private key. Empty resolves
      to <etc>/certs/client/mo/MO_LEAF_PASSWORD.txt; a missing or empty file means no password.
    type: string
    default: ""
  pnc_oem_prov_cert_path:
    description:
      Path to the OEM provisioning certificate (PEM). Signs CertificateInstallationReq and
      holds the static ECDH key that decrypts the delivered contract key. Empty resolves to
      <etc>/certs/client/oem/OEM_LEAF.pem.
    type: string
    default: ""
  pnc_oem_prov_key_path:
    description:
      Path to the OEM provisioning private key (PEM). Empty resolves to
      <etc>/certs/client/oem/OEM_LEAF.key.
    type: string
    default: ""
  pnc_oem_prov_key_password_path:
    description:
      Path to the file holding the password of the OEM provisioning private key. Empty
      resolves to <etc>/certs/client/oem/OEM_LEAF_PASSWORD.txt.
    type: string
    default: ""
  pnc_force_cert_install:
    description:
      Run a CertificateInstallation even when a contract certificate is configured. Requires
      the SECC to offer the Certificate service.
    type: boolean
    default: false
  ac_phase_count:
    description:
      Number of AC lines the EV draws on, 1 or 3. Selects which connector the EV
      asks for and divides the advertised totals below into per-line values once
      the L2 and L3 elements are present.
    type: integer
    enum: [1, 3]
    default: 3
  ac_max_charge_power_w:
    description:
      Advertised AC maximum charge power in watts, as a total across ac_phase_count
      lines. The default is 16 A x 230 V x 3.
    type: number
    minimum: 0
    default: 11040
  ac_min_charge_power_w:
    description:
      Advertised AC minimum charge power in watts, as a total across ac_phase_count
      lines. The default is 6 A x 230 V x 3.
    type: number
    minimum: 0
    default: 4140
  der_over_frequency_watt_mode:
    description: Declare support for the IEC OverFrequencyWattMode DER control function.
    type: boolean
    default: false
  der_under_frequency_watt_mode:
    description: Declare support for the IEC UnderFrequencyWattMode DER control function.
    type: boolean
    default: false
  der_volt_watt_mode:
    description: Declare support for the IEC VoltWattMode DER control function.
    type: boolean
    default: false
  der_volt_var_mode:
    description: Declare support for the IEC VoltVarMode DER control function.
    type: boolean
    default: false
  der_watt_var_mode:
    description: Declare support for the IEC WattVarMode DER control function.
    type: boolean
    default: false
  der_watt_cos_phi_mode:
    description: Declare support for the IEC WattCosPhiMode DER control function.
    type: boolean
    default: false
  der_dso_q_setpoint_provision:
    description: Declare support for the IEC DSOQSetpointProvision DER control function.
    type: boolean
    default: true
  der_dso_cos_phi_setpoint_provision:
    description: Declare support for the IEC DSOCosPhiSetpointProvision DER control function.
    type: boolean
    default: true
  der_dc_injection_restriction:
    description: Declare support for the IEC DCInjectionRestriction DER control function.
    type: boolean
    default: false
  der_zero_current_mode:
    description: Declare support for the IEC ZeroCurrentMode DER control function.
    type: boolean
    default: false
  der_over_voltage_fault_ride_through_mode:
    description: Declare support for the IEC OverVoltageFaultRideThroughMode DER control function.
    type: boolean
    default: false
  der_under_voltage_fault_ride_through_mode:
    description: Declare support for the IEC UnderVoltageFaultRideThroughMode DER control function.
    type: boolean
    default: false
  der_stop_on_unsupported_functions:
    description: Stop the session if no AC_DER_IEC parameter set fits the supported DER functions.
    type: boolean
    default: true
  ac_max_discharge_power_w:
    description:
      Advertised AC maximum discharge power in watts (AC_BPT and AC_DER_IEC), as a
      three-phase total. The default is 16 A x 230 V x 3.
    type: number
    minimum: 0
    default: 11040
  ac_min_discharge_power_w:
    description:
      Advertised AC minimum discharge power in watts (AC_BPT and AC_DER_IEC), as a
      three-phase total. The default is 6 A x 230 V x 3.
    type: number
    minimum: 0
    default: 4140
  dc_max_discharge_power_w:
    description: Advertised DC maximum discharge power in watts (BPT).
    type: number
    minimum: 0
    default: 150000
  dc_min_discharge_power_w:
    description: Advertised DC minimum discharge power in watts (BPT).
    type: number
    minimum: 0
    default: 0
  dc_max_discharge_current_a:
    description: Advertised DC maximum discharge current in amperes (BPT).
    type: number
    minimum: 0
    default: 300
provides:
  ev:
    interface: ISO15118_ev
    description: ISO 15118 EVCC on the libiso15118 ev::Controller
