description: >-
  MCS (Megawatt Charging System) data link supervision for the EV side, ISO 15118-10:2025.
  Single-pair ethernet (10BASE-T1S) replaces HomePlug PLC, so there is no SLAC matching
  procedure; the D-LINK service primitives of ISO 15118-3 are reused, which is why this module
  provides the existing `ev_slac` interface and EvManager needs no modification. The link
  lifecycle is supervised through the network device carrier (rtnetlink IFF_LOWER_UP).
provides:
  main:
    interface: ev_slac
    description: >-
      EV-side D-LINK primitives for the MCS data link. Despite the interface name no SLAC is
      performed - MATCHING means "waiting for the SPE link to come up".
    config:
      device:
        description: >-
          Network device carrying the MCS single-pair ethernet link. Any netdev works: a
          Chargebridge TAP configured with `plc.carrier: firmware`, or a real SPE netdev.
          The device does not have to exist at startup; the module waits for it to appear.
        type: string
        default: cb_plc
      link_detect_timeout_ms:
        description: >-
          The EV's communication setup deadline. ISO 15118-10 bounds it twice with the same
          4000 ms: TT_EV_link_detect (Table 8) for detecting a valid link, and T_conn_resume
          (V2G10-035) for finishing communication setup after B/B_AUX was detected. On expiry the
          communication initialization has FAILED (V2G10-054) and the state returns to UNMATCHED.
          Unlike the EVSE side there is no retry loop: V2G10-039 has the EV wait for the EVSE's
          restart indication, which reaches this module as another trigger_matching.
        type: integer
        minimum: 100
        maximum: 4000
        default: 4000
      neighbor_liveness:
        description: >-
          Additionally supervise the link through the kernel neighbour table (NUD) of the
          configured device. A neighbour going NUD_FAILED with no other reachable neighbour left
          counts as a detected link loss (V2G10-036), which the carrier alone cannot see when the
          local PHY reports itself operational but the peer is gone.
        type: boolean
        default: true
      liveness_grace_ms:
        description: >-
          Debounce for neighbor_liveness. After the last neighbour of the device has gone
          NUD_FAILED the link only counts as lost if no neighbour has become reachable again
          within this time. Keeps a single failed probe of an address that re-resolves from
          tearing down a healthy session. 0 acts immediately.
        type: integer
        minimum: 0
        default: 1000
      publish_connector_mac:
        description: >-
          Publish the peer's MAC address once a neighbour of the configured device becomes
          reachable. On the EV side the peer is the SECC, so this is the charging connector's
          MAC address that the `ev_mac_address` variable is documented to carry.
        type: boolean
        default: true
