[package]
name = "RsEvseManager"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[build-dependencies]
everestrs-build = { workspace = true }

[dependencies]
anyhow = "1.0.82"
chrono = "0.4.31"
everestrs = { workspace = true }
log = "0.4.20"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.6.0"
