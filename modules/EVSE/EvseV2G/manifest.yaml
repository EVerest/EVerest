description: >-
  This module includes a DIN70121 and ISO15118-2 implementation provided by
  chargebyte GmbH.
  DEPRECATED in 2026.10.0, earliest removal in 2027.04.0: superseded by the
  Evse15118D20 module, which runs DIN SPEC 70121, ISO 15118-2 and ISO 15118-20
  on the C++ ISO 15118 stack. See the how-to guide "Migrate from EvseV2G and
  IsoMux to Evse15118D20" for the upgrade path.
config:
  device:
    description: >-
      Ethernet device used for HLC. Any local interface that has an ipv6
      link-local and a MAC addr will work
    type: string
    default: eth0
  tcp_port:
    description: >-
      TCP port used for unencrypted ISO 15118 communication
    type: integer
    minimum: 1
    maximum: 65535
    default: 61341
  tls_port:
    description: >-
      TCP port used for TLS-protected ISO 15118 communication
    type: integer
    minimum: 1
    maximum: 65535
    default: 64109
  supported_DIN70121:
    description: The EVSE supports the DIN SPEC
    type: boolean
    default: true
  supported_ISO15118_2:
    description: The EVSE supports ISO15118-2
    type: boolean
    default: true
  tls_security:
    description: >-
      Controls how to handle encrypted communication
    type: string
    enum:
    - prohibit
    - allow
    - force
    default: allow
  terminate_connection_on_failed_response:
    description: >-
      If true the V2G connection is terminated right after a FAILED response, as
      [V2G2-539] requires. If false the connection stays open so that the EV can run
      its own stop sequence. Independent of this setting, the connection is always
      terminated after FAILED_SequenceError and after a FAILED ISO 15118-2
      PaymentDetailsRes or AuthorizationRes, so that a rejected identification is
      never followed by further requests.
    type: boolean
    default: false
  dc_stop_contactor_open_timeout_response:
    description: >-
      DC only. The PowerDeliveryRes(Stop) is held until the board support reports
      the contactor open (DIN SPEC 70121 at most 1.4 s, ISO 15118-2 at most 3 s).
      This selects the response if the contactor is not reported open in time.
      ok_with_warning: ResponseCode OK and a warning in the log. failed:
      ResponseCode FAILED, so that the EV is not told the stop succeeded while
      side B may still be live; terminate_connection_on_failed_response applies.
      This is a station policy and only changes what the EV is told: no error is
      raised on the station side (a contactor that does not open is a board
      support fault), welding detection does not take place and the session ends
      with an error on the EV side. Only use failed with a board support that
      reliably reports contactor_closed(false) within the wait; with a slower one
      every DC stop ends with FAILED. Behind IsoMux, set it in both EvseV2G and
      Evse15118D20 to cover all protocols.
    type: string
    enum:
    - ok_with_warning
    - failed
    default: ok_with_warning
  welding_detection_on_missing_voltage:
    description: >-
      DC only. Every WeldingDetectionRes waits up to 1.4 s for values of the welding detection
      voltage source that EvseManager reports after the request. This selects the response if no
      value arrived at all. last_value: ResponseCode OK with the last present voltage, which can be
      an old sample or the power supply output from before welding detection, and a warning in the
      log. failed: ResponseCode FAILED, so that a stalled source is not reported as a valid
      voltage; terminate_connection_on_failed_response applies (with false the TCP connection
      stays open). With one value at the deadline the response is still OK with that value, which
      can have been taken up to one poll interval of the source before the request. FAILED skips
      the rest of welding detection and raises no error on the station side. To also keep
      EvseManager from falling back to the power supply as source, set its
      welding_detection_voltage_fallback_to_power_supply to false. Behind IsoMux, set it in both
      EvseV2G and Evse15118D20 to cover all protocols.
    type: string
    enum:
    - last_value
    - failed
    default: last_value
  tls_key_logging:
    description: >-
      Enable/Disable the export of TLS session keys (pre-master-secret)
      during a TLS handshake. This log file can be used to decrypt TLS
      sessions. Note that this option is for testing and simulation
      purpose only
    type: boolean
    default: false
  tls_key_logging_path:
    description:  >-
      Output directory for the TLS key log file
    type: string
    default: /tmp
  tls_timeout:
    description: >-
      Set the TLS timeout in ms when establishing a tls connection 
    type: integer
    default: 15000
  verify_contract_cert_chain:
    description: >-
      Specifies if the EVSE should verify the contract certificate
      chain locally.
    type: boolean
    default: false
  auth_timeout_pnc:
    description: >-
      Defines how many seconds the EVSE should wait for authorization in PnC case,
      before the charging session is aborted.
      Write 0 if the EVSE should wait indefinitely for PnC authorization.
    type: integer
    default: 55
  auth_timeout_eim:
    description: >-
      Defines how many seconds the EVSE should wait for authorization in EIM case,
      before the charging session is aborted.
      Write 0 if the EVSE should wait indefinitely for EIM authorization.
    type: integer
    default: 300
  enable_sdp_server:
    description: >-
      Enable the built-in SDP server
    type: boolean
    default: true
  publish_telemetry_only_on_change:
    description: >-
      Only publish telemetry blocks when values changed.
    type: boolean
    default: true
provides:
  charger:
    interface: ISO15118_charger
    description: >-
      This module implements the ISO15118-2 implementation of
      an AC or DC charger
  extensions:
    interface: iso15118_extensions
    description: >-
      This interface is used to share data between ISO15118 and OCPP modules
      to support the requirements of the OCPP protocol
requires:
  security:
    interface: evse_security
  iso15118_vas:
    interface: ISO15118_vas
    min_connections: 0
    max_connections: 128
enable_telemetry: true
