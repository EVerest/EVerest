description: >-
  This module is a draft implementation of iso15118-20 for the EVSE side
config:
  device:
    description: >-
      Ethernet device used for HLC. Any local interface that has an ipv6
      link-local and a MAC addr will work
    type: string
    default: eth0
  logging_path:
    description: >-
      This option should no longer be used and will be removed in the future.
      Path to logging directory (will be created if non existent)
    type: string
    default: "."
  tls_negotiation_strategy:
    description: >-
      Select strategy on how to negotiate connection encryption. TLS needs a V2G leaf certificate from
      the security module; when none is installed the SECC still starts and offers unsecured sessions
      only (ISO 15118-2 with EIM, DIN SPEC 70121), except with ENFORCE_TLS, which then refuses to start.
    type: string
    enum:
      - ACCEPT_CLIENT_OFFER
      - ENFORCE_TLS
      - ENFORCE_NO_TLS
    default: ACCEPT_CLIENT_OFFER  
  enforce_tls_1_3:
    description: >-
      Enforcing tls version 1.3. Applies whenever a TLS connection is established, independently of
      tls_negotiation_strategy: it pins the min/max protocol version, the cipher list and the
      client_hello certificate-verify elevation. Set to true for ISO 15118-20 (mandates TLS 1.3 mTLS).
      Set to false to offer TLS 1.2 (cipher ECDHE-ECDSA-AES128-SHA256, no client-certificate request),
      which is required for ISO 15118-2 / DIN SPEC 70121.
    type: boolean
    default: false
  supported_DIN70121:
    description: >-
      Offer DIN SPEC 70121 (DC only) in the SupportedAppProtocol handshake. Negotiated with the
      lowest priority (after ISO 15118-20 and ISO 15118-2).
    type: boolean
    default: false
  supported_ISO15118_2:
    description: >-
      Offer ISO 15118-2 (AC and DC) in the SupportedAppProtocol handshake. Negotiated with a lower
      priority than ISO 15118-20 but higher than DIN SPEC 70121.
    type: boolean
    default: false
  supported_ISO15118_20:
    description: >-
      Offer ISO 15118-20 (AC and DC) in the SupportedAppProtocol handshake. Negotiated with the
      highest priority. At least one of supported_ISO15118_20, supported_ISO15118_2 and
      supported_DIN70121 must be enabled. ISO 15118-20 is TLS-only ([V2G20-2677]), so it is silently
      dropped from the offer when no V2G leaf certificate is available; ISO 15118-2 and DIN SPEC 70121
      keep running unsecured in that case. When a certificate IS available, -20 stays in the offer even
      on unsecured connections (ENFORCE_NO_TLS, or an EV requesting no transport security): such a
      session works but is not standard-conformant, and is logged as a warning. Set this to false to
      offer only ISO 15118-2 / DIN SPEC 70121 on unsecured deployments.
    type: boolean
    default: true
  auth_timeout_eim:
    description: >-
      Defines how many seconds the EVSE should wait for authorization in EIM (External Payment) case,
      before the charging session is aborted. Write 0 if the EVSE should wait indefinitely for EIM
      authorization. Applies to ISO 15118-2 and DIN SPEC 70121; ISO 15118-20 uses a fixed 3 min window.
    type: integer
    minimum: 0
    default: 300
  auth_timeout_pnc:
    description: >-
      Defines how many seconds the EVSE should wait for authorization in PnC (Contract) case, before the
      charging session is aborted. Write 0 if the EVSE should wait indefinitely for PnC authorization.
      Applies to ISO 15118-2 only: DIN SPEC 70121 has no Plug-and-Charge and ISO 15118-20 uses a fixed
      3 min window. The default is the 55 s V2G_SECC_Ongoing_Performance_Time of [V2G2-712/713].
    type: integer
    minimum: 0
    default: 55
  enable_ssl_logging:
    description: Verbosely log the ssl/tls connection
    type: boolean
    default: false
  enable_tls_key_logging:
    description: >-
      Enable/Disable the export of TLS session keys (pre-master-secret)
      during a TLS handshake. Note that this option is for testing and
      simulation purpose only
    type: boolean
    default: false
  tls_key_logging_path:
    description:  >-
      Output directory for the TLS key log file
    type: string
    default: /tmp
  enable_sdp_server:
    description: >-
      Enable the built-in SDP server
    type: boolean
    default: true
  supported_dynamic_mode:
    description: The EVSE should support dynamic mode
    type: boolean
    default: true
  supported_mobility_needs_mode_provided_by_secc:
    description: >-
      The EVSE should support the mobility needs mode provided by the SECC.
      Mobility needs mode provided by the EVCC is always provided.
    type: boolean
    default: false
  supported_scheduled_mode:
    description: The EVSE should support scheduled mode
    type: boolean
    default: false
  custom_protocol_namespace:
    description: Providing a custom protocol namespace.
    type: string
    default: ""
  negative_bidirectional_limits:
    description: >-
      Some cars send or expect negative discharge limits. However, it is not clear from the standard
      whether the discharge limits should be negative. Until this is clarified, the positive limits
      can be converted using this option.
    type: boolean
    default: false
  selecting_sap_based_on_energy_service:
    description: >-
      Based on ISO15118-20 AMD1, selecting the SAP namespace does not imply a final selection.
      The final decision on which service to select is made later in the D20 service states.
      However, since AMD1 is relatively new, it is possible that EVs will only support certain energy services
      after the SAP namespace has been selected. If this is the case, this option should be set to true
      so that libiso15118 will select the sap namespace based on the supported energy services.
    type: boolean
    default: false
provides:
  charger:
    interface: ISO15118_charger
    description: >-
      This interface provides limited access to iso15118-20
  extensions:
    interface: iso15118_extensions
    description: >-
      This interface is used to share data between ISO15118 and OCPP modules
      to support the requirements of the OCPP protocol
  grid_support:
    interface: grid_support
    description: >-
      Raises grid alarms from EV grid-event conditions and accepts active DER
      directives. Curve-family directives (VoltVar, WattVar, WattPF) are
      relayed to the EV as AC_DER_IEC control functions at the next V2G
      session; non-curve directives are logged and skipped.
requires:
  security:
    interface: evse_security
  iso15118_vas:
    interface: ISO15118_vas
    min_connections: 0
    max_connections: 128
