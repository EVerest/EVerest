# Minimal OpenTelemetry Collector config for the Example module demo: accept
# OTLP over HTTP and print everything that arrives, see docs/index.rst.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
