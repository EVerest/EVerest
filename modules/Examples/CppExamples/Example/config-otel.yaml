# Demo config for the OpenTelemetry prototype in the Example module, used by
# the `otel_env` target in BUILD.bazel.
active_modules:
  store:
    module: PersistentStore
  example:
    module: Example
    config_implementation:
      example:
        current: 42
        enum_test: one
        enum_test2: 2
    connections:
      kvs:
        - module_id: store
          implementation_id: main
  example_user:
    module: ExampleUser
    connections:
      example:
        - module_id: example
          implementation_id: example
