[package]
name = "RsExampleUser"
version = "0.1.0"
edition = "2021"
# Minimum toolchain, in sync with RUST_VERSION in MODULE.bazel.
rust-version = "1.86.0"

[dependencies]
everestrs = { workspace = true }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1"

[build-dependencies]
everestrs-build = { workspace = true }
