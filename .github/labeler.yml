# Path based pull request labels, applied by .github/workflows/on_pr_auto-label.yaml
# through actions/labeler. Labels are only added, never removed. The size/*
# label is computed by the workflow itself, not by this file.
#
# Extend this file when adding a module tree or library. Labels with release
# semantics (backport *, include-in-release, EVerestAPI *, experimental,
# deprecation) stay manual and must not appear here.

changed-files-labels-limit: 10

OCPP:
  - changed-files:
      - any-glob-to-any-file:
          - modules/EVSE/OCPP/**
          - modules/EVSE/OCPP201/**
          - modules/EVSE/OCPPmulti/**
          - lib/everest/ocpp/**
          - lib/everest/ocpp_module_common/**
          - tests/ocpp_tests/**

