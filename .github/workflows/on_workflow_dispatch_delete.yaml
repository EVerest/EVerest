name: Dispatch / Documentation / Delete Deployed Instance
on:
  workflow_dispatch:
    inputs:
      display_name:
        description: >
          Same human-readable label you provided when the build was triggered.
          The on-disk directory name is auto-derived from this (lowercased,
          non-[a-z0-9_] chars collapsed to underscores) using the same
          formula as the build workflow.
        required: true
        type: string
      confirm:
        description: >
          Must be checked to actually perform the deletion. A safety net
          against accidental triggers.
        required: true
        type: boolean
        default: false
      allow_release_delete:
        description: >
          If true, also permit deleting instances marked is_release=true
          (or whose name starts with 'release_' for legacy entries without
          info.json). Default false; release docs are part of the project's
          permanent history and should usually not be deleted.
        required: false
        type: boolean
        default: false

jobs:
  delete-instance:
    name: delete instance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "::error::The 'confirm' input must be checked to perform deletion."
            exit 1
          fi

      - name: Sanitize display_name into instance name
        id: sanitize
        # Keep this formula in sync with the "Sanitize instance name" step
        # in .github/workflows/job_build-docs.yaml.
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          sanitized=$(echo -n "$DISPLAY_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_' '_')
          if ! echo "$sanitized" | grep -qE '^[a-z0-9_]+$'; then
            echo "::error::display_name '$DISPLAY_NAME' sanitized to '$sanitized', which is not a valid instance name ([a-z0-9_]+)."
            exit 1
          fi
          echo "instance_name=${sanitized}" >> "$GITHUB_OUTPUT"
          echo "Sanitized: display_name='$DISPLAY_NAME' -> instance_name='${sanitized}'"

      - name: Mint deployed-docs write token
        id: docs-write-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DOCS_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: everest.github.io
          permission-contents: write

      - name: Configure Git user
        env:
          COMMITTER_NAME: ${{ steps.docs-write-token.outputs.app-slug }}[bot]
          COMMITTER_EMAIL: ${{ steps.docs-write-token.outputs.installation-id }}+${{ steps.docs-write-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config --global user.name "$COMMITTER_NAME"
          git config --global user.email "$COMMITTER_EMAIL"

      - name: Checkout source repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: source

      - name: Clone deployed docs repo
        env:
          OWNER: ${{ github.repository_owner }}
          DOCS_REPO_WRITE_TOKEN: ${{ steps.docs-write-token.outputs.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          echo "Cloning https://github.com/$OWNER/everest.github.io.git"
          # shellcheck disable=SC2016  # intentional: the token must stay
          # unexpanded so git resolves it from the environment via the helper.
          git -c credential.helper='!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$DOCS_REPO_WRITE_TOKEN"; }; f' \
            clone --depth 1 "https://github.com/$OWNER/everest.github.io.git" deployed_docs_repo

      - name: Delete instance and regenerate versions.json
        env:
          INSTANCE_NAME: ${{ steps.sanitize.outputs.instance_name }}
          ALLOW_RELEASE_DELETE: ${{ inputs.allow_release_delete }}
        run: |
          flags=""
          if [ "$ALLOW_RELEASE_DELETE" = "true" ]; then
            flags="--allow-release"
          fi
          python3 source/cmake/trailbook/delete_instance.py \
            --multiversion-root-directory "$(pwd)/deployed_docs_repo/docs" \
            --instance-name "$INSTANCE_NAME" \
            $flags

      - name: Commit and push
        working-directory: deployed_docs_repo
        env:
          INSTANCE_NAME: ${{ steps.sanitize.outputs.instance_name }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCS_REPO_WRITE_TOKEN: ${{ steps.docs-write-token.outputs.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No changes to commit (this shouldn't happen — instance dir was present earlier)."
            exit 1
          fi
          git commit -m "Delete docs instance: $INSTANCE_NAME (from display_name: \"$DISPLAY_NAME\")

          Triggered by @$ACTOR via workflow_dispatch.
          Source workflow run: $RUN_URL"
          # shellcheck disable=SC2016  # intentional: the token must stay
          # unexpanded so git resolves it from the environment via the helper.
          git -c credential.helper='!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$DOCS_REPO_WRITE_TOKEN"; }; f' \
            push origin HEAD:main
          echo "Pushed deletion to the docs repo."
