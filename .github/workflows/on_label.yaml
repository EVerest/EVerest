# Inspired by:
# Nixpkgs: https://github.com/NixOS/nixpkgs/blob/a698ac1214cd924d4394ca9cd2691618765aa03c/.github/workflows/backport.yml
# NixOS-WSL: https://github.com/nix-community/NixOS-WSL/blob/be894604b2aa2184c0b3d3b44995acd0da14dc0c/.github/workflows/on_label.yml

name: Backport

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR commits are cherry-picked, never executed
    types:
      - closed
      - labeled

jobs:
  backport:
    if: github.event.pull_request.labels && contains(join(github.event.pull_request.labels.*.name, ', '), 'backport ')
    name: backport pr
    runs-on: ubuntu-24.04
    # Every step authenticates with the App token, so GITHUB_TOKEN gets no permissions.
    permissions: {}
    outputs:
      created_pull_numbers: ${{ steps.backport.outputs.created_pull_numbers }}
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BACKPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Check actor permissions
        id: check-permissions
        uses: prince-chrismc/check-actor-permissions-action@v4.0.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          permission: write

      # backport-action cherry-picks in this clone and pushes with its stored credentials.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Create backport PR
        id: backport
        uses: korthout/backport-action@v4.7.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          merge_commits: "skip"
          add_author_as_assignee: true
          copy_requested_reviewers: true
          add_labels: 'backport'
          experimental: >-
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
