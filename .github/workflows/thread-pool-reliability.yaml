name: Thread pool reliability

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: thread-pool-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install focused test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libgtest-dev ninja-build
      - name: Configure normal and fault-probe suite
        run: |
          cmake -S lib/everest/util/tests/reliability -B build/AGENT/thread-pool-reliability -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=clang++-18
      - name: Run short normal and subprocess cases
        run: |
          cmake --build build/AGENT/thread-pool-reliability --parallel 2
          ctest --test-dir build/AGENT/thread-pool-reliability --output-on-failure
      - name: Run extended lifecycle and fault matrix
        env:
          EVEREST_THREAD_POOL_STRESS_ROUNDS: '1000'
          EVEREST_THREAD_POOL_STRESS_SEED: '9826'
          EVEREST_THREAD_POOL_PROBE_STRESS: '1'
        run: |
          timeout --kill-after=10s 300s build/AGENT/thread-pool-reliability/everest_thread_pool_scaling_reliability_tests \
            --gtest_filter='ThreadPoolScalingReliabilityStress.DISABLED_RepeatedCoreLifecycleAndShutdownRaces' \
            --gtest_also_run_disabled_tests
          timeout --kill-after=10s 600s build/AGENT/thread-pool-reliability/everest_thread_pool_scaling_probe_driver \
            --gtest_filter='ThreadPoolScalingProbeDriver.DISABLED_ExtendedMatrix' --gtest_also_run_disabled_tests
      - name: Configure and run AddressSanitizer normal suite
        run: |
          cmake -S lib/everest/util/tests/reliability -B build/AGENT/thread-pool-reliability-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DEVEREST_UTIL_RELIABILITY_FAULT_PROBES=OFF \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build/AGENT/thread-pool-reliability-asan --target everest_thread_pool_scaling_reliability_tests --parallel 2
          ctest --test-dir build/AGENT/thread-pool-reliability-asan -R ThreadPoolScalingReliability --output-on-failure
      - name: Configure and run ThreadSanitizer normal suite
        run: |
          cmake -S lib/everest/util/tests/reliability -B build/AGENT/thread-pool-reliability-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DEVEREST_UTIL_RELIABILITY_FAULT_PROBES=OFF \
            -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'
          cmake --build build/AGENT/thread-pool-reliability-tsan --target everest_thread_pool_scaling_reliability_tests --parallel 2
          ctest --test-dir build/AGENT/thread-pool-reliability-tsan -R ThreadPoolScalingReliability --output-on-failure
