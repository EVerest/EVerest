# Labels every pull request by its changed paths (.github/labeler.yml), by the
# Conventional Commit type of its title and by its size in changed lines.
# Area and type labels are only added, never removed; the size/* label is
# recomputed on every push. Runs on pull_request_target so fork PRs can be
# labeled; nothing from the PR is checked out or executed.

name: Label PR

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label pr
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label by changed paths
        uses: actions/labeler@v7
        with:
          sync-labels: false

      - name: Label by Conventional Commit type
        uses: actions/github-script@v8
        with:
          script: |
            const typeLabels = {
              feat: 'enhancement',
              feature: 'enhancement',
              fix: 'bug',
              bugfix: 'bug',
              hotfix: 'bug',
              docs: 'documentation',
              doc: 'documentation',
              ci: 'CI/CD',
              test: 'testing',
              tests: 'testing',
              chore: 'chore',
              refactor: 'refactor',
              perf: 'performance',
            };
            // Optional "[Backport stable/2026.02] " prefix, then type(scope)!: subject
            const match = context.payload.pull_request.title
              .match(/^(?:\[[^\]]*\]\s*)?([A-Za-z]+)(?:\(([^)]*)\))?!?:/);
            if (!match) {
              core.info('Title does not follow Conventional Commits, no type label');
              return;
            }
            const type = match[1].toLowerCase();
            const label = typeLabels[type];
            if (!label) {
              core.info(`No label for type "${type}"`);
              return;
            }
            if (context.payload.pull_request.labels.some((l) => l.name === label)) {
              return;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });

      - name: Label by size
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            // Vendored, lock and generated files do not count toward the size.
            const excludedPrefixes = [
              'third-party/',
              'lib/3rd_party/',
              'lib/everest/cbv2g/lib/',
              'lib/everest/cbv2g/include/',
            ];
            const isExcluded = (path) =>
              excludedPrefixes.some((prefix) => path.startsWith(prefix)) ||
              path.endsWith('.lock') ||
              path.endsWith('/package-lock.json') ||
              path === 'package-lock.json';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // The API lists at most 3000 files; beyond that use the PR totals.
            const lines = files.length < pr.changed_files
              ? pr.additions + pr.deletions
              : files
                  .filter((f) => !isExcluded(f.filename))
                  .reduce((n, f) => n + f.additions + f.deletions, 0);

            const buckets = [[10, 'XS'], [30, 'S'], [100, 'M'], [500, 'L'], [1000, 'XL']];
            const size = (buckets.find(([limit]) => lines < limit) ?? [null, 'XXL'])[1];
            const label = `size/${size}`;
            core.info(`${lines} changed lines -> ${label}`);

            const stale = pr.labels
              .map((l) => l.name)
              .filter((name) => name.startsWith('size/') && name !== label);
            for (const name of stale) {
              await github.rest.issues
                .removeLabel({ ...context.repo, issue_number: pr.number, name })
                .catch((e) => {
                  if (e.status !== 404) throw e;
                });
            }
            if (pr.labels.some((l) => l.name === label)) {
              return;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: pr.number,
              labels: [label],
            });
