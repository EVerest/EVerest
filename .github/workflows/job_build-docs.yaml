name: Build and Deploy Documentation

on:
  workflow_call:
    inputs:
      runner:
        description: 'Which runner to use'
        required: false
        default: 'ubuntu-24.04'
        type: string
      build_kit_artifact_name:
        description: 'The name of the build kit artifact to download'
        required: true
        type: string
      build_kit_image_tag:
        description: 'The tag of the build-kit image to use for building the project'
        required: true
        type: string
      build_kit_scripts_directory:
        description: 'Directory in the repository where the build kit scripts are located'
        required: false
        default: '.ci/build-kit/scripts'
        type: string
      deploy_docs:
        description: 'Whether to deploy the built documentation to the target repository'
        required: false
        default: false
        type: boolean
      is_fork:
        description: 'Whether the current repository is a fork'
        required: true
        type: boolean
      is_release:
        description: 'Whether the current build is for a release version'
        required: false
        default: false
        type: boolean
      overwrite_existing_instance:
        description: 'Whether to overwrite the existing documentation instance if it already exists'
        required: false
        default: true
        type: boolean
      instance_name:
        description: 'The name of the instance to build the documentation for'
        required: true
        type: string
      display_name:
        description: 'The human-readable label shown in the version switcher (defaults to the sanitized instance name if empty)'
        required: false
        default: ''
        type: string
    secrets:
      PRIVATE_DEPS_SSH_KEY:
        description: >-
          Optional SSH private key granting read access to private
          dependencies. Leave unset when every dependency is public.
        required: false
      DOCS_DEPLOY_APP_CLIENT_ID:
        description: >-
          Client ID of the GitHub App installed on <owner>/everest.github.io.
          Required whenever the build should read the deployed-docs repository
          or deploy to it. When unset, documentation is built standalone.
        required: false
      DOCS_DEPLOY_APP_PRIVATE_KEY:
        description: >-
          Private key of the GitHub App identified by DOCS_DEPLOY_APP_CLIENT_ID.
        required: false
    outputs:
      docs_html_artifact_name:
        description: 'The name of the docs-html artifact'
        value: ${{ jobs.build-docs.outputs.docs_html_artifact_name }}


jobs:
  build-docs:
    name: build
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    env:
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      DOCS_HTML_ARTIFACT_NAME: docs-html
    outputs:
      docs_html_artifact_name: ${{ env.DOCS_HTML_ARTIFACT_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: source
      - name: Setup SSH agent for private dependencies
        uses: ./source/.github/actions/setup-ssh-agent
        with:
          ssh_private_key: ${{ secrets.PRIVATE_DEPS_SSH_KEY }}
          ssh_auth_sock: ${{ env.SSH_AUTH_SOCK }}
      - name: Sanitize instance name
        id: sanitize
        # Keep this formula in sync with the "Sanitize display_name into
        # instance name" step in .github/workflows/on_workflow_dispatch_delete.yaml.
        env:
          INSTANCE_NAME: ${{ inputs.instance_name }}
        run: |
          set -euo pipefail
          sanitized=$(echo -n "$INSTANCE_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_' '_')
          echo "instance_name=${sanitized}" >> "$GITHUB_OUTPUT"
          echo "Sanitized instance name: ${sanitized}"
      - name: Verify documentation deployment prerequisites
        if: ${{ inputs.deploy_docs == true }}
        env:
          IS_FORK: ${{ inputs.is_fork }}
          HAVE_APP: ${{ secrets.DOCS_DEPLOY_APP_CLIENT_ID != '' && secrets.DOCS_DEPLOY_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::deploy_docs is enabled but this run originates from a fork. Forks cannot deploy documentation."
            exit 1
          fi
          if [ "$HAVE_APP" != "true" ]; then
            echo "::error::deploy_docs is enabled but DOCS_DEPLOY_APP_CLIENT_ID and DOCS_DEPLOY_APP_PRIVATE_KEY are not both configured."
            exit 1
          fi
          echo "Documentation deployment prerequisites satisfied."
      - name: Determine deployed-docs repository access
        id: docs_access
        env:
          IS_FORK: ${{ inputs.is_fork }}
          IS_RELEASE: ${{ inputs.is_release }}
          HAVE_APP: ${{ secrets.DOCS_DEPLOY_APP_CLIENT_ID != '' && secrets.DOCS_DEPLOY_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = "true" ] || [ "$HAVE_APP" != "true" ]; then
            # No credential for the private deployed-docs repository. Build only
            # this instance. Trailbook rejects DOWNLOAD_ALL_VERSIONS and
            # IS_RELEASE both being off, so IS_RELEASE is forced on here; the
            # effect is confined to this build directory and nothing is pushed.
            echo "::notice::Building documentation standalone: no access to the deployed-docs repository. The version switcher will list only this instance."
            {
              echo "download_all_versions=OFF"
              echo "is_release=true"
              echo "artifact_path=build/docs/trailbook_everest_build"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Building documentation against the deployed-docs repository."
            {
              echo "download_all_versions=ON"
              echo "is_release=$IS_RELEASE"
              echo "artifact_path=build/docs/deployed_docs_repo/docs"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Download build-kit image
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.build_kit_artifact_name }}
      - name: Load build-kit image
        env:
          BUILD_KIT_IMAGE_TAG: ${{ inputs.build_kit_image_tag }}
        run: |
          docker load -i build-kit.tar
          docker image tag "$BUILD_KIT_IMAGE_TAG" build-kit
      - name: Format branch name for cache key
        run: |
          BRANCH_NAME_FOR_CACHE="${GITHUB_REF_NAME//-/_}"
          echo "branch_name_for_cache=${BRANCH_NAME_FOR_CACHE}" >> "$GITHUB_ENV"
      # Restore only: the compile cache is written by the CMake GCC job on main.
      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: compile-${{ env.branch_name_for_cache }}-${{ github.sha }}
          restore-keys: |
            compile-${{ env.branch_name_for_cache }}-
            compile-
      - name: Setup run scripts
        env:
          BUILD_KIT_SCRIPTS_DIRECTORY: ${{ inputs.build_kit_scripts_directory }}
        run: |
          mkdir scripts
          rsync -a "source/${BUILD_KIT_SCRIPTS_DIRECTORY}/" scripts
      - name: Prepare deployed-docs repository URL
        id: github-pages-input
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Always HTTPS. Authentication is injected by build_docs.sh through a
          # git credential helper, so the URL carries no credential and the same
          # remote works for the runner-side push.
          echo "url=https://github.com/$OWNER/everest.github.io" >> "$GITHUB_OUTPUT"
      - name: Mint deployed-docs read token
        id: docs-read-token
        if: ${{ steps.docs_access.outputs.download_all_versions == 'ON' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DOCS_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: everest.github.io
          permission-contents: read
      - name: Build Documentation
        env:
          DOCS_REPO_READ_TOKEN: ${{ steps.docs-read-token.outputs.token }}
          TRAILBOOK_everest_DOWNLOAD_ALL_VERSIONS: ${{ steps.docs_access.outputs.download_all_versions }}
          TRAILBOOK_everest_IS_RELEASE: ${{ steps.docs_access.outputs.is_release }}
          TRAILBOOK_everest_INSTANCE_NAME: ${{ steps.sanitize.outputs.instance_name }}
          TRAILBOOK_everest_DISPLAY_NAME: ${{ inputs.display_name }}
          TRAILBOOK_everest_OVERWRITE_EXISTING_INSTANCE: ${{ inputs.overwrite_existing_instance }}
          EVEREST_DOCS_REPO_URL: ${{ steps.github-pages-input.outputs.url }}
        run: |
          docker run \
          --mount "type=bind,source=$SSH_AUTH_SOCK,target=/ssh-agent" \
          --env SSH_AUTH_SOCK=/ssh-agent \
          --env DOCS_REPO_READ_TOKEN \
          --env TRAILBOOK_everest_DOWNLOAD_ALL_VERSIONS \
          --env TRAILBOOK_everest_IS_RELEASE \
          --env TRAILBOOK_everest_INSTANCE_NAME \
          --env TRAILBOOK_everest_DISPLAY_NAME \
          --env TRAILBOOK_everest_OVERWRITE_EXISTING_INSTANCE \
          --env EVEREST_DOCS_REPO_URL \
          --volume "${GITHUB_WORKSPACE}:/ext" \
          --name build-docs-container \
          build-kit run-script build_docs
      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          path: ${{ github.workspace }}/${{ steps.docs_access.outputs.artifact_path }}/
          name: ${{ env.DOCS_HTML_ARTIFACT_NAME }}
      - name: Mint deployed-docs write token
        id: docs-write-token
        if: ${{ inputs.deploy_docs == true }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DOCS_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: everest.github.io
          permission-contents: write
      - name: Deploy Documentation
        if: ${{ inputs.deploy_docs == true }}
        env:
          DOCS_REPO_WRITE_TOKEN: ${{ steps.docs-write-token.outputs.token }}
          COMMITTER_NAME: ${{ steps.docs-write-token.outputs.app-slug }}[bot]
          COMMITTER_EMAIL: ${{ steps.docs-write-token.outputs.installation-id }}+${{ steps.docs-write-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: |
          docker run \
          --env DOCS_REPO_WRITE_TOKEN \
          --env GITHUB_SHA \
          --env COMMITTER_NAME \
          --env COMMITTER_EMAIL \
          --volume "${GITHUB_WORKSPACE}:/ext" \
          --name deploy-docs-container \
          build-kit run-script deploy_docs
