name: Lint Repository

on:
  workflow_call:    
    inputs:
      runner:
        description: 'Which runner to use'
        required: false
        default: 'ubuntu-24.04'
        type: string
      ref_everest_ci:
        description: 'The ref of the everest-ci repository to checkout'
        required: true
        type: string

jobs:
  lint:
    name: clang-format
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout local github actions
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/everest-ci
          ref: ${{ inputs.ref_everest_ci }}
          path: everest-ci
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: source
      - name: Run clang-format
        uses: ./everest-ci/github-actions/run-clang-format
        with:
          source-dir: source
          extensions: hpp,cpp
          exclude: applications/utils/ev-dev-tools/tests/fixtures/golden

  himalayas-tests:
    name: himalayas unit tests
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            applications/himalayas_record
            .ci/himalayas
            .github/workflows
      - name: Install himalayas_record
        run: |
          python3 -m venv "$RUNNER_TEMP/himalayas"
          "$RUNNER_TEMP/himalayas/bin/pip" install --quiet ./applications/himalayas_record
      - name: Run unit tests
        run: |
          "$RUNNER_TEMP/himalayas/bin/python" -I -m unittest discover -s applications/himalayas_record/tests -v
      - name: Run collector unit tests
        run: |
          "$RUNNER_TEMP/himalayas/bin/python" -I -m unittest discover -s .ci/himalayas/tests -v
