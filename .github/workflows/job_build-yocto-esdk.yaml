name: Yocto eSDK Build
run-name: ${{ github.actor }} is building everest-core with the Yocto eSDK
on:
  workflow_call:
    inputs:
      runner:
        description: 'Which runner to use'
        required: false
        default: 'ubuntu-24.04'
        type: string
      esdk_image:
        description: 'Container image with the installed Yocto extensible SDK'
        required: true
        type: string
jobs:
  yocto-esdk-build:
    name: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      ESDK_IMAGE: ${{ inputs.esdk_image }}
    steps:
      # The eSDK image is ~9 GB compressed and ~12 GB unpacked, and the everest-core build
      # needs several GB more, which does not fit next to the tools preinstalled on the runner.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull eSDK image
        run: |
          docker pull "$ESDK_IMAGE"
          df -h /
      # The image runs as builder (uid 1001), the user of the GitHub hosted runners,
      # so the bind-mounted checkout is writable inside the container.
      - name: Build everest-core with devtool
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work/everest" \
            "$ESDK_IMAGE" \
            bash -euo pipefail -c '
              . /opt/esdk/environment-setup-* > /dev/null
              # Debug info makes up most of the ~20 GB build directory of everest-core.
              echo "DEBUG_FLAGS:pn-everest-core = \"\"" >> /opt/esdk/conf/local.conf
              devtool modify -n everest-core /work/everest
              devtool build everest-core
            '
          df -h /
      - name: Log out of GitHub Container Registry
        if: ${{ always() }}
        run: docker logout ghcr.io
