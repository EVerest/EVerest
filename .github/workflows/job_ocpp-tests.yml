name: OCPP Tests

on:
  workflow_call:
    inputs:
      runner:
        description: 'Which runner to use'
        required: false
        default: 'ubuntu-24.04'
        type: string
      ref:
        description: 'The commit or branch to check out, the triggering one when empty'
        required: false
        default: ''
        type: string
      artifacts_run_id:
        description: 'The workflow run to download the artifacts from, this run when empty'
        required: false
        default: ''
        type: string
      dist_artifact_name:
        description: 'The name of the dist artifact to download'
        required: true
        type: string
      wheels_artifact_name:
        description: 'The name of the wheels artifact to download'
        required: true
        type: string
      build_kit_artifact_name:
        description: 'The name of the build-kit artifact to download'
        required: true
        type: string
      build_kit_image_tag:
        description: 'The tag of the build-kit image to use for building the project, the loaded image when empty'
        required: false
        default: ''
        type: string
      build_kit_scripts_directory:
        description: 'Directory in the repository where the build kit scripts are located'
        required: false
        default: '.ci/build-kit/scripts'
        type: string
    outputs:
      ocpp_tests_artifact_name:
        description: 'The name of the OCPP tests artifact'
        value: ${{ jobs.ocpp-tests.outputs.ocpp_tests_artifact_name }}


jobs:
  ocpp-tests:
    name: tests
    runs-on: ${{ inputs.runner }}
    env:
      OCPP_TESTS_ARTIFACT_NAME: ocpp-tests-artifacts
    outputs:
      ocpp_tests_artifact_name: ${{ env.OCPP_TESTS_ARTIFACT_NAME }}
    steps:
      - name: Download dist dir
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.dist_artifact_name }}
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ inputs.artifacts_run_id != '' && github.token || '' }}
      - name: Extract dist.tar.gz
        run: |
          tar -xzf ${{ github.workspace }}/dist.tar.gz -C ${{ github.workspace }}
      - name: Download wheels
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.wheels_artifact_name }}
          path: wheels
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ inputs.artifacts_run_id != '' && github.token || '' }}
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: source
      - name: Setup run scripts
        run: |
          mkdir scripts
          rsync -a source/${{ inputs.build_kit_scripts_directory }}/ scripts
      - name: Download build-kit image
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.build_kit_artifact_name }}
          run-id: ${{ inputs.artifacts_run_id }}
          github-token: ${{ inputs.artifacts_run_id != '' && github.token || '' }}
      - name: Load build-kit image
        env:
          BUILD_KIT_IMAGE: ${{ inputs.build_kit_image_tag }}
        run: |
          set -euo pipefail
          loaded=$(docker load -i build-kit.tar)
          echo "$loaded"
          image="$BUILD_KIT_IMAGE"
          if [ -z "$image" ]; then
            image=$(printf '%s\n' "$loaded" | sed -n 's/^Loaded image: //p' | head -n 1)
          fi
          if [ -z "$image" ]; then
            echo "::error::build_kit_image_tag is empty and docker load printed no 'Loaded image:' line"
            exit 1
          fi
          docker image tag "$image" build-kit
      - name: Create integration-image
        run: |
          docker run \
          --volume "${{ github.workspace }}:/ext" \
          --name integration-container \
          build-kit run-script create_ocpp_tests_image
          docker commit integration-container integration-image
      - name: Run OCPP tests
        id: run_ocpp_tests
        continue-on-error: true
        run: |
          # The OCPP tests mostly wait on protocol timers, so they run with two workers per core. At
          # four per core a 4-vCPU GitHub runner is CPU-bound: the tests take about twice as long and
          # timing-sensitive ones fail. The cap of 64 bounds the memory use on large runners.
          workers=$(( $(nproc) * 2 ))
          workers=$(( workers > 64 ? 64 : workers ))
          docker compose \
          -f source/.ci/e2e/docker-compose.yaml \
          run \
          e2e-test-server \
          tests/run-tests.sh ocpp \
          -j "$workers" \
          --everest-prefix /ext/dist \
          --junitxml /ext/ocpp-tests-result.xml \
          --html /ext/ocpp-tests-report.html
      - name: Upload result and report as artifact
        continue-on-error: true
        if: ${{ steps.run_ocpp_tests.outcome == 'success' || steps.run_ocpp_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: ${{ env.OCPP_TESTS_ARTIFACT_NAME }}
          path: |
            ocpp-tests-result.xml
            ocpp-tests-report.html
      - name: Render OCPP tests result
        if: ${{ steps.run_ocpp_tests.outcome == 'success' || steps.run_ocpp_tests.outcome == 'failure' }}
        uses: pmeier/pytest-results-action@v0.9.0
        with:
          path: ocpp-tests-result.xml
          summary: True
          display-options: fEX
          fail-on-empty: True
          title: Test results
      - name: Check if OCPP tests failed
        if: ${{ steps.run_ocpp_tests.outcome == 'failure' }}
        run: exit 1
