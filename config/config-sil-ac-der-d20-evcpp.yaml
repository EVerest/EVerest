# AC ISO 15118-20 SIL with the C++ EVCC (EvIso15118D20) driven in AC_DER_IEC mode.
#
# Run:
#   ./build/dist/bin/manager --config build/dist/etc/everest/config-sil-ac-der-d20-evcpp.yaml
#
# Prerequisites this config cannot express on its own:
#   EvseManager only advertises the AC_DER_IEC energy transfer mode once a protocol backend has
#   declared DER wiring via its set_der_available command, and Evse15118D20 only offers DER control
#   functions that were pushed into its grid_support provider. There is no OCPP module here, so both
#   have to come from outside: the SIL test (tests/core_tests/ev_iso15118d20_der_module_test.py)
#   supplies them from the probe module before EVerest reaches global ready. Booting this config
#   without such a driver yields a plain AC session offer and the EV's AC_DER_IEC request finds no
#   matching service.
#
# The iso15118_car der_* settings below declare more control functions than any single SECC offer is
# expected to carry, which is what makes the negotiated set an intersection rather than a copy.
active_modules:
  iso15118_charger:
    module: Evse15118D20
    config_module:
      device: auto
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  iso15118_car:
    module: EvIso15118D20
    config_module:
      device: auto
      evcc_id: "AA:BB:CC:DD:EE:01"
      response_timeout_ms: 8000
      ac_max_charge_power_w: 11040
      ac_min_charge_power_w: 4140
      ac_max_discharge_power_w: 11040
      ac_min_discharge_power_w: 4140
      # Declared DER control functions. WattCosPhiMode is the one a WattPF grid_support directive
      # relays to, so it is the one a SECC offer can match. VoltVarMode and DSOQSetpointProvision are
      # declared but not expected in any offer here, so they stay out of the negotiated set.
      der_watt_cos_phi_mode: true
      der_volt_var_mode: true
      der_dso_q_setpoint_provision: true
      der_dso_cos_phi_setpoint_provision: false
      der_stop_on_unsupported_functions: true
  evse_manager:
    module: EvseManager
    config_module:
      ac_enforce_hlc: false
      ac_hlc_enabled: true
      ac_hlc_use_5percent: false
      ac_nominal_voltage: 230
      ac_max_reactive_power: 5000
      supported_iso_ac_bpt: true
      charge_mode: AC
      connector_id: 1
      ev_receipt_required: false
      evse_id: DE*PNX*E12345*1
      has_ventilation: true
      payment_enable_contract: false
      payment_enable_eim: true
      session_logging: true
      session_logging_path: /tmp/everest-logs
      session_logging_xml: false
      switch_3ph1ph_delay_s: 5
      switch_3ph1ph_cp_state: X1
      bpt_channel: Unified
      bpt_generator_mode: GridFollowing
      bpt_grid_code_island_method: Passive
    connections:
      bsp:
        - module_id: connector_1_powerpath
          implementation_id: board_support
      hlc:
        - module_id: iso15118_charger
          implementation_id: charger
      powermeter_car_side:
        - module_id: connector_1_powerpath
          implementation_id: powermeter
      slac:
        - module_id: slac
          implementation_id: evse
      ac_rcd:
        - implementation_id: rcd
          module_id: connector_1_powerpath
      connector_lock:
        - implementation_id: connector_lock
          module_id: connector_1_powerpath
  connector_1_powerpath:
    config_module:
      connector_id: 1
    connections: {}
    module: YetiSimulator
    telemetry:
      id: 1
  slac:
    module: SlacSimulator
  ev_manager:
    module: EvManager
    config_module:
      connector_id: 1
      auto_enable: true
      auto_exec: false
      auto_exec_commands: sleep 3;iso_wait_slac_matched;iso_start_v2g_session ac_der;iso_wait_pwr_ready;iso_draw_power_regulated 16,3;iso_wait_for_stop 20;iso_wait_v2g_session_stopped;unplug
    connections:
      ev_board_support:
        - module_id: connector_1_powerpath
          implementation_id: ev_board_support
      ev:
        - module_id: iso15118_car
          implementation_id: ev
      slac:
        - module_id: slac
          implementation_id: ev
  auth:
    module: Auth
    config_module:
      connection_timeout: 10
      selection_algorithm: FindFirst
    connections:
      token_provider:
        - module_id: token_provider
          implementation_id: main
      token_validator:
        - module_id: token_validator
          implementation_id: main
      evse_manager:
        - module_id: evse_manager
          implementation_id: evse
  token_provider:
    module: DummyTokenProvider
    config_implementation:
      main:
        timeout: 10
        token: DEADBEEF
    connections:
      evse:
        - module_id: evse_manager
          implementation_id: evse
  token_validator:
    module: DummyTokenValidator
    config_implementation:
      main:
        validation_result: Accepted
        validation_reason: Token seems valid
        sleep: 0.25
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
  energy_manager:
    module: EnergyManager
    config_module:
      schedule_total_duration: 1
      schedule_interval_duration: 60
      debug: false
    connections:
      energy_trunk:
        - module_id: grid_connection_point
          implementation_id: energy_grid
  grid_connection_point:
    module: EnergyNode
    config_module:
      fuse_limit_A: 40.0
      phase_count: 3
    connections:
      price_information: []
      energy_consumer:
        - module_id: api_sink
          implementation_id: energy_grid
      powermeter:
        - module_id: connector_1_powerpath
          implementation_id: powermeter
  api_sink:
    module: EnergyNode
    mapping:
      module:
        evse: 1
    config_module:
      fuse_limit_A: 32.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager
          implementation_id: energy_grid
  api:
    module: API
    connections:
      evse_manager:
        - module_id: evse_manager
          implementation_id: evse
      error_history:
        - module_id: error_history
          implementation_id: error_history
      evse_energy_sink:
        - module_id: api_sink
          implementation_id: external_limits
  error_history:
    module: ErrorHistory
    config_implementation:
      error_history:
        database_path: /tmp/error_history.db
x-module-layout: {}
