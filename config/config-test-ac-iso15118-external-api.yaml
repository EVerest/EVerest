# AC charging with ISO 15118-2 where the hardware is played by an external API
# client (applications/utils/everest-api-client, see
# examples/ac_iso15118_2_session.script). Software-only.
#
# The ISO 15118 stacks are the real EVerest modules: Evse15118D20 on the
# charger side, PyEvJosev + EvManager as the simulated car, connected by the
# SlacSimulator. The API modules replace the hardware simulation: bsp_api is the
# charger's board support, ev_bsp_api the car's, and the API client connects
# the two like a charging cable (CP state, PWM, relays). It also plays the
# powermeter and the token provider and validator.
#
# For ISO 15118-20 set the car's supported_ISO15118_2 to false and add
# supported_ISO15118_20_AC: true, supported_d20_energy_services: AC,
# tls_active: true and enable_tls_1_3: true.
#
# The car starts its session by itself (EvManager auto_exec) a few seconds after
# EVerest is up, so start the script right after EVerest.
settings:
  telemetry_enabled: false
active_modules:
  # ---- hardware and backend, played by the API client ----
  bsp_api:
    module: evse_board_support_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  ev_bsp_api:
    module: ev_board_support_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  powermeter_api:
    module: powermeter_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  token_provider_api:
    module: auth_token_provider_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  token_validator_api:
    module: auth_token_validator_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  # publishes the session events the script waits for
  evse_manager_api:
    module: evse_manager_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      evse_manager:
        - module_id: connector_1
          implementation_id: evse

  # ---- charger ----
  connector_1:
    module: EvseManager
    config_module:
      connector_id: 1
      evse_id: DE*PNX*E12345*1
      charge_mode: AC
      ac_hlc_enabled: true
      ac_enforce_hlc: false
      ac_hlc_use_5percent: false
      ac_nominal_voltage: 230
      payment_enable_eim: true
      payment_enable_contract: false
      session_logging: false
    connections:
      bsp:
        - module_id: bsp_api
          implementation_id: main
      ac_rcd:
        - module_id: bsp_api
          implementation_id: rcd
      connector_lock:
        - module_id: bsp_api
          implementation_id: connector_lock
      powermeter_grid_side:
        - module_id: powermeter_api
          implementation_id: main
      slac:
        - module_id: slac
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger
          implementation_id: charger
  iso15118_charger:
    module: Evse15118D20
    config_module:
      device: auto
      supported_DIN70121: false
      supported_ISO15118_2: true
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
  slac:
    module: SlacSimulator
  auth:
    module: Auth
    config_module:
      connection_timeout: 60
      selection_algorithm: FindFirst
      ignore_connector_faults: true
    connections:
      evse_manager:
        - module_id: connector_1
          implementation_id: evse
      token_provider:
        - module_id: token_provider_api
          implementation_id: main
      token_validator:
        - module_id: token_validator_api
          implementation_id: main
  energy_manager:
    module: EnergyManager
    connections:
      energy_trunk:
        - module_id: grid_connection_point
          implementation_id: energy_grid
  grid_connection_point:
    module: EnergyNode
    config_module:
      fuse_limit_A: 32
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: connector_1
          implementation_id: energy_grid

  # ---- car ----
  ev_manager:
    module: EvManager
    config_module:
      connector_id: 1
      auto_enable: true
      auto_exec: true
      auto_exec_commands: sleep 5;iso_wait_slac_matched;iso_start_v2g_session AC;iso_wait_pwr_ready;iso_draw_power_regulated 16,3;iso_wait_for_stop 20;iso_wait_v2g_session_stopped;unplug
    connections:
      ev:
        - module_id: iso15118_car
          implementation_id: ev
      ev_board_support:
        - module_id: ev_bsp_api
          implementation_id: main
      slac:
        - module_id: slac
          implementation_id: ev
  iso15118_car:
    module: PyEvJosev
    config_module:
      device: auto
      supported_ISO15118_2: true
