# MCS ChargeBridge, EV side, FULL ISO 15118-20 SESSION stack.
# EvController plus the C++ EVCC (Ev15118) drive a complete MCS session over the SPE wire.
# Meant to run inside a network namespace so SDP, TCP and neighbour discovery genuinely cross
# the wire rather than looping back on the host.
#
# Companion piece: pionix_chargebridge with
# applications/pionix_chargebridge/config/config-CB-MCS-EV.yaml (charge_bridge.type EV, TAP
# "cb_plc_ev", ev_bsp.module_id "ev_bsp"). The EVSE side runs from config-CB-EVAL-MCS.yaml in
# the root namespace.
#
# EvController starts the configured MCS session when the physical pilot is present
# and 5 % PWM is received. DcIsoD20 with mcs_enabled requests the MCS service.
#
# After a session stops, cycle the physical pilot through unplugged and plugged
# before starting another session. The board supplies the pilot directly; no
# EvDriverSim or external charging-session script is involved.
settings:
  telemetry_enabled: false
  mqtt_everest_prefix: everest_mcs_ev
active_modules:
  ev_bsp:
    module: ev_board_support_API
    config_module:
      cfg_communication_check_to_s: 0
  mcs_ev_datalink:
    module: McsEvDataLink
    config_implementation:
      main:
        device: cb_plc_ev
  iso15118_car:
    module: Ev15118
    config_module:
      device: cb_plc_ev
      supported_DIN70121: false
      supported_ISO15118_2: false
      tls_active: true
      enable_tls_1_3: true
      # Test PKI: the SECC's leaf is not anchored in a V2G root this EVCC ships with.
      verify_server_certificate: false
  ev_manager:
    module: EvController
    config_module:
      default_session: '{"mode":"DcIsoD20","params":{"mcs_enabled":true}}'
      connector_id: 1
      dc_target_current: 20
      dc_target_voltage: 400
    connections:
      ev_board_support:
        - module_id: ev_bsp
          implementation_id: main
      ev:
        - module_id: iso15118_car
          implementation_id: ev
      slac:
        - module_id: mcs_ev_datalink
          implementation_id: main
  ev_api:
    module: EvAPI
    connections:
      ev_manager:
        - module_id: ev_manager
          implementation_id: ev_manager
