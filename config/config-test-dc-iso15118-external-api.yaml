# DC charging with ISO 15118-2 or DIN SPEC 70121 where the hardware is played
# by an external API client (applications/utils/everest-api-client, see
# examples/dc_session.script). Software-only.
#
# The ISO 15118 / DIN 70121 stacks are the real EVerest modules: Evse15118D20
# on the charger side, PyEvJosev + EvManager as the simulated car, connected by
# the SlacSimulator. The API modules replace the hardware simulators: the
# charging cable between bsp_api and ev_bsp_api (YetiSimulator), the DC power
# supply psu_api with its powermeter dc_powermeter_api (DCSupplySimulator), the
# isolation monitor imd_api (IMDSimulator) and the over voltage monitor ovm_api
# (OVMSimulator). The client also plays the token provider and validator.
#
# The car offers ISO 15118-2 and DIN SPEC 70121 and uses ISO 15118-2. To
# charge with DIN SPEC 70121 set its supported_ISO15118_2 to false; for
# ISO 15118-20 set supported_DIN70121 and supported_ISO15118_2 to false and add
# supported_ISO15118_20_DC: true, tls_active: true and enable_tls_1_3: true.
#
# The car starts its session by itself (EvManager auto_exec) a few seconds after
# EVerest is up, so start the script right after EVerest.
settings:
  telemetry_enabled: false
active_modules:
  # ---- hardware and backend, played by the API client ----
  bsp_api:
    module: evse_board_support_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  ev_bsp_api:
    module: ev_board_support_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  dc_powermeter_api:
    module: powermeter_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  psu_api:
    module: power_supply_DC_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  imd_api:
    module: isolation_monitor_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  ovm_api:
    module: over_voltage_monitor_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  token_provider_api:
    module: auth_token_provider_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  token_validator_api:
    module: auth_token_validator_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  # publishes the session events the script waits for
  evse_manager_api:
    module: evse_manager_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      evse_manager:
        - module_id: connector_1
          implementation_id: evse

  # ---- charger ----
  connector_1:
    module: EvseManager
    config_module:
      connector_id: 1
      evse_id: DE*PNX*E12345*1
      evse_id_din: 49A80737A45678
      charge_mode: DC
      payment_enable_eim: true
      payment_enable_contract: false
      session_logging: false
    connections:
      bsp:
        - module_id: bsp_api
          implementation_id: main
      ac_rcd:
        - module_id: bsp_api
          implementation_id: rcd
      connector_lock:
        - module_id: bsp_api
          implementation_id: connector_lock
      powermeter_car_side:
        - module_id: dc_powermeter_api
          implementation_id: main
      powersupply_DC:
        - module_id: psu_api
          implementation_id: main
      imd:
        - module_id: imd_api
          implementation_id: main
      over_voltage_monitor:
        - module_id: ovm_api
          implementation_id: main
      slac:
        - module_id: slac
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger
          implementation_id: charger
  iso15118_charger:
    module: Evse15118D20
    config_module:
      device: auto
      supported_DIN70121: true
      supported_ISO15118_2: true
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
  slac:
    module: SlacSimulator
  auth:
    module: Auth
    config_module:
      connection_timeout: 60
      selection_algorithm: FindFirst
      ignore_connector_faults: true
    connections:
      evse_manager:
        - module_id: connector_1
          implementation_id: evse
      token_provider:
        - module_id: token_provider_api
          implementation_id: main
      token_validator:
        - module_id: token_validator_api
          implementation_id: main
  energy_manager:
    module: EnergyManager
    connections:
      energy_trunk:
        - module_id: grid_connection_point
          implementation_id: energy_grid
  grid_connection_point:
    module: EnergyNode
    config_module:
      fuse_limit_A: 32
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: connector_1
          implementation_id: energy_grid

  # ---- car ----
  ev_manager:
    module: EvManager
    config_module:
      connector_id: 1
      auto_enable: true
      auto_exec: true
      dc_target_current: 20
      dc_target_voltage: 400
      auto_exec_commands: sleep 5;iso_wait_slac_matched;iso_start_v2g_session DC;iso_wait_pwr_ready;iso_dc_power_on;iso_wait_for_stop 20;iso_wait_v2g_session_stopped;unplug
    connections:
      ev:
        - module_id: iso15118_car
          implementation_id: ev
      ev_board_support:
        - module_id: ev_bsp_api
          implementation_id: main
      slac:
        - module_id: slac
          implementation_id: ev
  iso15118_car:
    module: PyEvJosev
    config_module:
      device: auto
      supported_DIN70121: true
      supported_ISO15118_2: true
