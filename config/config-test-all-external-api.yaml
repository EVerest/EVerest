# Test configuration instantiating ALL EVerest API modules so every external
# API client (applications/utils/everest-api-client) can be exercised against
# a running EVerest. Software-only: no hardware drivers are used; the API
# modules themselves stand in for the hardware (drive them from the client).
#
# The module ids below are what you pass to `client_add <Type>Client <id>`.
#
# Note: ocpp_cli (BUOcppConsumer) is a standalone bring-up TUI; EVerest waits
# for it, so start it in a second terminal. Drop ocpp_api + ocpp_cli if you do
# not need the ocpp_consumer_API (oc_) commands.
settings:
  telemetry_enabled: false
active_modules:
  # ---- provider API modules (the external client acts as the hardware) ----
  bsp_api:
    module: evse_board_support_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  ev_bsp_api:
    module: ev_board_support_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  powermeter_api:
    module: powermeter_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  slac_api:
    module: slac_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  imd_api:
    module: isolation_monitor_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  ovm_api:
    module: over_voltage_monitor_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  psu_dc_api:
    module: power_supply_DC_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  token_provider_api:
    module: auth_token_provider_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  token_validator_api:
    module: auth_token_validator_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  display_message_api:
    module: display_message_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  error_raiser_api:
    module: generic_error_raiser_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  system_api:
    module: system_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
  session_cost_api:
    module: session_cost_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000

  # ---- consumer API modules (the external client observes/drives EVerest) ----
  evse_manager_api:
    module: evse_manager_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      evse_manager:
        - module_id: connector_1
          implementation_id: evse
      evse_bsp:
        - module_id: bsp_api
          implementation_id: main
      slac:
        - module_id: slac_api
          implementation_id: main
      imd:
        - module_id: imd_api
          implementation_id: main
      ps_dc:
        - module_id: psu_dc_api
          implementation_id: main
  auth_api:
    module: auth_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      auth:
        - module_id: auth
          implementation_id: main
  ded_api:
    module: dc_external_derate_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      derate:
        - module_id: connector_1
          implementation_id: dc_external_derate
  error_history_api:
    module: error_history_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      error_history:
        - module_id: error_history
          implementation_id: error_history
  evse_security_api:
    module: evse_security_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      evse_security:
        - module_id: evse_security
          implementation_id: main
  eel_api:
    module: external_energy_limits_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      energy_node:
        - module_id: external_limits_node
          implementation_id: external_limits
  session_cost_consumer_api:
    module: session_cost_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      session_cost:
        - module_id: session_cost_api
          implementation_id: main
  ocpp_api:
    module: ocpp_consumer_API
    config_module:
      cfg_communication_check_to_s: 0
      cfg_heartbeat_interval_ms: 5000
    connections:
      ocpp:
        - module_id: ocpp_cli
          implementation_id: ocpp
      data_transfer:
        - module_id: ocpp_cli
          implementation_id: ocpp_data_transfer

  # ---- supporting EVerest modules ----
  connector_1:
    module: EvseManager
    config_module:
      connector_id: 1
      evse_id: DE*PNX*E12345*1
      charge_mode: AC
      ac_hlc_enabled: false
      session_logging: false
    connections:
      bsp:
        - module_id: bsp_api
          implementation_id: main
      ac_rcd:
        - module_id: bsp_api
          implementation_id: rcd
      connector_lock:
        - module_id: bsp_api
          implementation_id: connector_lock
      powermeter_grid_side:
        - module_id: powermeter_api
          implementation_id: main
      slac:
        - module_id: slac_api
          implementation_id: main
      imd:
        - module_id: imd_api
          implementation_id: main
      over_voltage_monitor:
        - module_id: ovm_api
          implementation_id: main
      powersupply_DC:
        - module_id: psu_dc_api
          implementation_id: main
  auth:
    module: Auth
    config_module:
      connection_timeout: 60
      selection_algorithm: FindFirst
      ignore_connector_faults: true
    connections:
      evse_manager:
        - module_id: connector_1
          implementation_id: evse
      token_provider:
        - module_id: token_provider_api
          implementation_id: main
      token_validator:
        - module_id: token_validator_api
          implementation_id: main
  error_history:
    module: ErrorHistory
    config_implementation:
      error_history:
        database_path: /tmp/everest_error_history.db
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
  energy_manager:
    module: EnergyManager
    connections:
      energy_trunk:
        - module_id: grid_connection_point
          implementation_id: energy_grid
  grid_connection_point:
    module: EnergyNode
    config_module:
      fuse_limit_A: 32
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: external_limits_node
          implementation_id: energy_grid
  external_limits_node:
    module: EnergyNode
    config_module:
      fuse_limit_A: 32
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: connector_1
          implementation_id: energy_grid
  # bring-up TUI faking the OCPP stack for ocpp_consumer_API; start it
  # manually in a second terminal (standalone)
  ocpp_cli:
    module: BUOcppConsumer
    standalone: true
