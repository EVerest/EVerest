# SonarQube Cloud configuration for EVerest.
# Branch / pull request parameters and the compilation database path are passed by
# .ci/build-kit/scripts/sonar_scan.sh; everything static lives here.

sonar.organization=everest-lfe
sonar.projectKey=EVerest_EVerest
sonar.projectName=EVerest

sonar.sourceEncoding=UTF-8
sonar.sources=.

# Vendored and generated code: not ours to fix, keep it out of the analysis.
sonar.exclusions=\
  third-party/**,\
  **/3rd_party/**,\
  **/third_party/**,\
  **/generated/**,\
  **/*.pb.h,\
  **/*.pb.cc,\
  build/**,\
  dist/**,\
  docs/**,\
  tests/**,\
  **/tests/**,\
  **/test/**

# Test code is not analysed: the C/C++ analyzer ignores sonar.tests, so tests would otherwise
# count as production code, and leaving them out cuts analysis time by about a fifth.
# sonar_scan.sh also drops test files from the compilation database.

