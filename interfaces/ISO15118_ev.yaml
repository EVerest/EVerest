description: This interface defines a simple ISO15118 ev.
cmds:
  start_charging:
    description: Start the ev charging process
    arguments:
      EnergyTransferMode:
        description: >-
          Selected energy transfer mode for charging that is requested
          by the EVCC
        type: string
        $ref: /iso15118#/EnergyTransferMode
      SelectedPaymentOption:
        description: Selected payment option
        type: object
        $ref: /iso15118#/SelectedPaymentOption
      DepartureTime:
        description: >-
          Seconds from this call until the EVCC wants to leave the charging
          station. 0 states no departure time. Must be finite and not negative.
        type: number
      EAmount:
        description: >-
          The amount of energy that the EVCC wants to charge (in kWh). 0 states
          no amount. Must be finite and not negative.
        type: number
    result:
      description: Returns true if the evcc simulation started
      type: boolean
  stop_charging:
    description: Stop the ev charging communication process
  pause_charging:
    description: Pause the ev charging communication process
  abort_charging:
    description: >-
      Terminate the V2G session immediately, without the SessionStop exchange.
      CP state E/F stops the session ([V2G2-737]); the connection is then torn down
      ([V2G2-728], [V2G2-025]).
  cp_state_changed:
    description: >-
      Control pilot state the vehicle applies. Gates the EVCC CP checks, e.g.
      C/D before CableCheckReq ([V2G2-912]).
      E or F during a session terminates it without SessionStop ([V2G2-737]).
    arguments:
      cp_state:
        description: The CP state the vehicle has applied
        type: string
        $ref: /iso15118#/CpState
  set_fault:
    description: >-
      TODO_SL: Set the different ev faults to communicate these errors
      to the charging station
  set_dc_params:
    description: >-
      Set the target parameters for a dc charging process. They are vehicle limits that stay for
      later sessions until the next call; a field left out keeps its previous value.
    arguments:
      EvParameters:
        description: Target parameters for dc charging
        type: object
        $ref: /iso15118#/DcEvParameters
  set_bpt_dc_params:
    description: >-
      Set the bpt parameters for dc charging. They are vehicle limits, like set_dc_params: they
      apply to a running bidirectional DC session and stay for later ones until the next call.
    arguments:
      EvBPTParameters:
        description: BPT parameters for dc charging
        type: object
        $ref: /iso15118#/DcEvBPTParameters
  enable_sae_j2847_v2g_v2h:
    description: Enable the SAE J2847 2 V2H V2G
  update_soc:
    description: Updating the EV SoC state
    arguments:
      SoC:
        description: The actual State of Charge from the EV
        type: number
        minimum: 0
  update_present_values:
    description: >-
      Updating the values the EV measures. Separate from update_soc because electrical
      measurements and SoC have different natural update rates.
    arguments:
      PresentValues:
        description: The values the EV currently measures
        type: object
        $ref: /iso15118#/EvPresentValues
vars:
  v2g_messages:
    description: >-
      The id of each V2G response the EV accepted, for every protocol. Requests the EV sends are
      not reported, and the JSON and EXI fields are never populated. The CP B transition after
      PowerDelivery(Stop) is signaled by power_delivery_stopped, not by this variable.
    type: object
    $ref: /iso15118#/V2gMessages
  power_delivery_stopped:
    description: >-
      The SECC confirmed PowerDelivery(Stop); the EV may open its contactor and set CP B.
    type: 'null'
  welding_detection_failed:
    description: >-
      DC welding detection reached its response or time limit without a safe EVSE present
      voltage, either because the reported voltage stayed unsafe or because no response was
      accepted, so a welded contactor cannot be ruled out. The EV terminates the session.
    type: object
    $ref: /iso15118#/WeldingDetectionFailure
  v2g_session_finished:
    description: The v2g session between the charger and the car is finished
    type: 'null'
  ev_power_ready:
    description: The car is ready for power (HLC)
    type: boolean
  ac_evse_max_current:
    description: EVSE max current per phase
    type: number
    minimum: 0
    maximum: 400
  ac_evse_target_power:
    description: Evse AC max target power
    type: object
    $ref: /iso15118#/AcTargetPower
  dc_power_on:
    description: The ev wants to close the dc contactors
    type: 'null'
  stop_from_charger:
    description: The charger wants to stop the charging process
    type: 'null'
  pause_from_charger:
    description: The charger wants to pause the session (only d20)
    type: 'null'
  dc_evse_present_current:
    description: EVSE-delivered present current during DC charging (A)
    type: number
  dc_evse_present_voltage:
    description: EVSE-delivered present voltage during DC charging (V)
    type: number
  der_negotiated_functions:
    description: >-
      The DER control functions negotiated for the session, for either DER annex: the demand of
      the selected parameter set for AC_DER_IEC, the enabled modes the EV echoes for AC_DER_SAE.
      AC_DER_IEC publishes once, from ServiceDetail; AC_DER_SAE once per ChargeParameterDiscovery
      round and in the charge loop whenever the set changes. The functions are in iec_functions
      for AC_DER_IEC and in sae_functions for AC_DER_SAE.
    type: object
    $ref: /iso15118#/DerNegotiatedFunctions
  der_control_received:
    description: >-
      Summary of each DER control block the SECC sends, for either DER annex, with one
      exception: AC_DER_IEC charge-loop blocks of the Scheduled control mode are not published.
      AC_DER_IEC Dynamic charge-loop blocks are published for the first of a session and then
      only when their setpoints change; ChargeParameterDiscovery blocks of either annex always are.
    type: object
    $ref: /iso15118#/DerControlReceived
