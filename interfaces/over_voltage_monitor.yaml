description: >-
  This interface defines a fast over voltage monitoring device (OVM) for DC charging
  according to IEC 61851-23:2023, 6.3.1.106: the EVSE shall detect an over voltage at side B
  between DC+ and DC- and perform an emergency shutdown or an error shutdown.

  The OVM hardware is responsible for the protection. It compares the voltage at side B with
  the limits received through set_limits and triggers the shutdowns itself, without EVerest,
  within the timings of the standard:

  - Emergency shutdown (6.3.1.106.2, Table 103): if the voltage is above
    emergency_over_voltage_limit_V for more than 9 consecutive ms, the emergency shutdown shall
    be triggered within 1 ms. The actual switch-off has to happen in the OVM or a lower layer
    outside of EVerest. Afterwards, report the error MREC5OverVoltage with severity High so that
    EVerest knows the nature of the shutdown.
  - Error shutdown (6.3.1.106.3, Table 104): if the voltage is above
    error_over_voltage_limit_V (the negotiated maximum voltage) for more than 400 consecutive
    ms, the error shutdown shall be triggered within 50 ms; between 200 ms and 400 ms the device
    may either allow the energy transfer or trigger the error shutdown; up to 200 ms the energy
    transfer continues. To trigger an error shutdown, raise the error MREC5OverVoltage with
    severity Medium or Low. EvseManager then stops the energy transfer, opens the contactors and
    turns the CP oscillator off (state X1). According to CC.3.4.2 (Table CC.11, t203) the OVM
    shall verify that the CP oscillator is off within 2.5 s after it detected the error and
    trigger an emergency shutdown otherwise.

  EvseManager also compares voltage_measurement_V with the limits it sent, as a backup only: a
  value at or above the emergency limit raises evse_manager/MREC5OverVoltage with severity High
  at once, a value above the error limit raises it with severity Medium after
  internal_over_voltage_duration_ms (400 ms by default) unless a later value was below the limit
  again. This backup works at the rate the device publishes, is armed by a single sample and
  does not meet the timings of the standard. It is not a replacement for the detection in the
  device.

  Once an MREC5OverVoltage error was raised, it shall only be cleared when the
  reset_over_voltage_error command is called. All other errors shall be raised/cleared when
  they occur/are no longer active immediately.

  The var voltage_measurement_V should be published in regular intervals, e.g. 1 second.
  Besides the backup check above, EvseManager uses it to validate that all voltage sources of
  the charging port (power supply, powermeter, isolation monitor, OVM) see the same voltage, so
  that they are wired to the same port: a spread above voltage_plausibility_max_spread_threshold_V
  (50 V by default) for voltage_plausibility_fault_duration_ms (30 s by default) raises
  evse_manager/VoltagePlausibilityFault and stops charging. If a measurement is not available in
  hardware, do not publish voltage_measurement_V at all; EvseManager then runs neither check.
cmds:
  set_limits:
    description: >-
      Set the overvoltage limits. It will be called any time the voltage limits change, independent of 
      whether the monitoring is currently active or not.
      The values shall be cached, and the last value received shall be used as threshold while monitoring is active.
    arguments:
      emergency_over_voltage_limit_V:
        description: >-
          Specifies the over voltage threshold [V] for emergency shutdown
          (based on IEC61851-23:2023 Table 103 and IEC61851-23-3:(DRAFT 2025) Table 202)
          An emergency shutdown shall be triggered if the DC output voltage is higher 
          than this value.
        type: number
      error_over_voltage_limit_V:
        description: >-
          Specifies the over voltage threshold [V] for error shutdown (for use with IEC61851-23:2023 Table 104).
          An error shutdown shall be triggered if the DC output voltage is higher 
          than this value. The OVM shall trigger an emergency shutdown if error shutdown does not work properly
          (after 2.5s, see CC.3.4.2).
        type: number
  start:
    description: >-
      Start monitoring. Called once at the beginning of power transfer.
      Use the last limits set by set_limits and make sure to update them when set_limits is called while monitoring is active.
      Trigger shutdowns and raise errors as needed.
  stop:
    description: >-
      Stop monitoring. Called once at the end of power transfer.
      Do not raise any over voltage errors or trigger any shutdowns in this mode.
  reset_over_voltage_error:
    description: >-
      Resets the detection logic to allow for new charging session after an over voltage error occurred.
      This shall clear the over voltage error.
      If monitoring is still active, it shall be stopped.
vars:
  voltage_measurement_V:
    description: >-
      The voltage at side B measured by the OVM, published in regular intervals, e.g. 1 second.
      The protection itself runs in the device; EvseManager only uses this value for its backup
      check against the limits and for the plausibility check across all voltage sources (see
      the interface description). If it is not available in hardware, do not publish it at all.
    type: number
errors:
  - reference: /errors/over_voltage_monitor
