description: >-
  Implemented by a module that adds components and variables to the device model of an OCPP service at runtime, next
  to those of the component config. The OCPP module requires this interface, with any number of connections. Each
  variable has one owner, which keeps its value current, receives the writes to it and keeps its persistent
  attributes across restarts. An owner is named by the module id of the providing module, unless the module names the
  owners it acts on behalf of itself. A registration is held in memory only and is repeated at every start of the OCPP
  service.
cmds:
  get_registrations:
    description: >-
      Called once by the OCPP module at startup, before the OCPP service starts; the OCPP service starts only after
      every connected module answered. The module answers from data it holds, without waiting for the OCPP module.
      It returns a registration for every owner it acts for, also for owners whose devices are not available yet:
      the first start of the OCPP service removes the monitors of the variables that nobody registered, so only the
      owners registered here keep those of earlier boots.
    result:
      description: The registrations of all owners the module acts for
      type: object
      $ref: /ocpp_device_model#/Registrations
  set_registration_result:
    description: >-
      Called by the OCPP module once for every registration it applies, from get_registrations or the registration
      var, with the variables that the device model rejected and, in OCPP 1.6 mode, the variables whose ocpp16_key was
      refused. A registration replaced by a newer one of the same owner
      before it was applied, at startup or before the OCPP service started, is answered only through the newer one. A
      registration the device model fails to apply is answered with Rejected, and its owner is dropped. An owner name
      belongs to the module that registered it first, until that module releases it with an empty registration; a
      registration of another module for it is rejected with OwnerInUse.
    arguments:
      result:
        description: The outcome of the registration of one owner
        type: object
        $ref: /ocpp_device_model#/RegistrationResult
  set_value:
    description: >-
      Applies a write to an attribute of a registered variable, from the CSMS, a SetVariables.req for example, or from
      the OCPP service itself. The module publishes the owner's answer as a write_result in owner_message, in its place
      among the owner's other messages, and returns the same status only after that. A write the owner does not
      answer in time is answered Rejected with a write_result that carries no value, so its place does not matter. The OCPP module waits for the
      answer without a deadline, so the module answers promptly, well within the message timeout of the CSMS, and
      rejects a write it cannot complete by then, also with a write_result. Calls to one module instance are delivered
      one at a time, so a write answered late delays the following ones.
      Accepted means that the owner applied exactly the written value: the OCPP service stores it when it handles the
      write_result, so the owner does not report it with a value_change. RebootRequired means that the owner kept
      exactly the written value, and that it takes effect at the next start: the OCPP service does not store it and
      keeps the current value, and the owner registers the new value at the next start. An owner that would apply or
      keep another value, a clamped one for example, rejects the write.
    arguments:
      request:
        description: The write to apply
        type: object
        $ref: /ocpp_device_model#/WriteRequest
      request_id:
        description: Identifies the write in the write_result that answers it
        type: string
    result:
      description: >-
        Accepted, RebootRequired or Rejected, as in the write_result. UnknownComponent, UnknownVariable and
        NotSupportedAttributeType are returned to the CSMS as they are.
      type: string
      $ref: /ocpp#/SetVariableStatusEnumType
vars:
  owner_message:
    description: >-
      Every registration, value change and write result of the owners of the module, published in the order in which
      the module received them from the owners, so that the OCPP service applies them in that order and an owner's
      latest message wins.
      A registration replaces the registration of one owner at runtime, or adds an owner; the registrations of the
      other owners of the module stay. An empty components list removes everything the owner registered and releases
      the owner name; writes to the owner that are still waiting for their write_result are answered Rejected. The
      monitors of a variable survive a registration that registers it again. An owner added after startup starts
      without the monitors of earlier boots, which the first start of the OCPP service removed. In OCPP 1.6 mode, the
      ocpp16_key of each variable is mapped while the registration lasts: a registration replaces the keys of the
      owner's earlier one, and a release removes them. At startup get_registrations is authoritative: a message
      published before the OCPP module subscribed is lost.
      A value change reports a value of a registered variable that the owner changed itself. Every change is reported:
      the OCPP service holds the values in memory and serves reads from there. A value change of a value that does not
      fit the variable, or for an owner that is not registered by the module, is ignored and logged by the OCPP module.
      A write result answers a set_value call.
    type: object
    $ref: /ocpp_device_model#/OwnerMessage
