description: This file contains the types for the error history interface
types:
  ImplementationIdentifier:
    description: Identifier of an implementation
    type: object
    required:
      - module_id
      - implementation_id
    properties:
      module_id:
        type: string
        minLength: 2
      implementation_id:
        type: string
        minLength: 2
  State:
    description: State of an error
    type: string
    enum:
      - Active
      - ClearedByModule
      - ClearedByReboot
  SeverityFilter:
    description: Severity filter for errors
    type: string
    enum:
      - HIGH_GE
      - MEDIUM_GE
      - LOW_GE
  TimeperiodFilter:
    description: Timeperiod filter for errors
    type: object
    required:
      - timestamp_from
      - timestamp_to
    properties:
      timestamp_from:
        type: string
        format: date-time
      timestamp_to:
        type: string
        format: date-time
  FilterArguments:
    description: Arguments for the get_errors command
    type: object
    required: []
    properties:
      state_filter:
        $ref: /error_history#/State
      origin_filter:
        $ref: /error_history#/ImplementationIdentifier
      type_filter:
        type: string
      severity_filter:
        $ref: /error_history#/SeverityFilter
      timeperiod_filter:
        $ref: /error_history#/TimeperiodFilter
      handle_filter:
        type: string
        description: Handle of an error
  Severity:
    description: Severity of an error
    type: string
    enum:
      - High
      - Medium
      - Low
  TriggerValue:
    description: Value that caused a specific occurrence of an error, e.g. the measurement that crossed a limit
    type: object
    required:
      - text_repr
    properties:
      text_repr:
        description: >-
          Text representation of the value as the raising entity would print it, including a unit where one
          applies, e.g. `85.3 degC`. Truncated to 2500 characters when raised.
        type: string
        maxLength: 2500
    additionalProperties: false
  ErrorObject:
    description: Represents an error
    type: object
    required:
      - type
      - description
      - message
      - origin
      - timestamp
      - uuid
      - severity
      - state
    properties:
      type:
        type: string
        minLength: 2
      sub_type:
        type: string
      description:
        description: Description of the error type from its definition in the errors YAML files
        type: string
        minLength: 2
      message:
        description: Free text chosen by the raiser of the error; empty if it gave none
        type: string
      severity:
        $ref: /error_history#/Severity
      origin:
        $ref: /error_history#/ImplementationIdentifier
      timestamp:
        type: string
        format: date-time
      uuid:
        type: string
        minLength: 2
      state:
        $ref: /error_history#/State
      vendor_id:
        description: Vendor of the error type as given by the raiser of the error; absent when empty
        type: string
      trigger_value:
        description: Value that caused this occurrence of the error; absent when the raising entity named none
        $ref: /error_history#/TriggerValue
    additionalProperties: false
  
