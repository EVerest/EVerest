description: Types for persistently stored session records
types:
  SessionState:
    description: |
      Lifecycle state of a stored session record
        Open: The session is ongoing.
        Finished: The session finished. Sessions with a running transaction that were interrupted by a power cycle are also closed by the module during recovery on the next boot, in which case the transaction carries stop reason PowerLoss and the session stop timestamp is the time of the recovery.
        Stale: The session never finished and never will. A newer session was started on the same EVSE while this record was still Open, which means tracking of this one was lost, for example in a crash or a power cycle during a session without a running transaction.
    type: string
    enum:
      - Open
      - Finished
      - Stale
  Transaction:
    description: >-
      The transaction charged within a session. It starts at the point where all
      preconditions for charging are met and finishes when one of them irrevocably
      becomes false, so the fields that are only known at the end of a transaction are
      absent while it is running.
    type: object
    additionalProperties: false
    required:
      - timestamp_start
      - energy_Wh_import_start
    properties:
      timestamp_start:
        description: Time the transaction started, in RFC3339 format
        type: string
        format: date-time
      timestamp_stop:
        description: >-
          Time the transaction finished, in RFC3339 format. Absent while the
          transaction is still running.
        type: string
        format: date-time
      energy_Wh_import_start:
        description: Total imported energy reading taken when the transaction started, in Wh
        type: number
      energy_Wh_import_stop:
        description: >-
          Total imported energy reading taken when the transaction finished, in Wh.
          Absent while the transaction is still running.
        type: number
      id_token_hash:
        description: >-
          Hash of the id token that started the transaction. The raw token is never
          stored as a dedicated field, but note that a stored signed meter value
          embeds it (OCMF ID field). Computed as the lower case hex encoded SHA256
          digest of the id token type concatenated with the id token value, matching
          the hash the OCPP stack uses for its authorization cache, so a hash computed
          elsewhere in the stack can be compared to this one directly. Absent only if
          the digest could not be calculated.
        type: string
        minLength: 64
        maxLength: 64
      id_token_type:
        description: >-
          Type of the id token that started the transaction. Part of the input to
          id_token_hash, so it is needed to reproduce the hash.
        type: string
        $ref: /authorization#/IdTokenType
      authorization_type:
        description: >-
          How the id token was presented, i.e. which authorization mechanism started
          this transaction
        type: string
        $ref: /authorization#/AuthorizationType
      stop_reason:
        description: >-
          Why the transaction was stopped. Absent while the transaction is still
          running. A transaction that was interrupted by a power cycle and recovered on
          the next boot carries PowerLoss.
        type: string
        $ref: /evse_manager#/StopTransactionReason
      signed_meter_value_start:
        description: >-
          Signed meter value (e.g. an OCMF record) captured when the transaction
          started. Only populated when the module is configured to store signed meter
          values via its store_signed_meter_values config option. Be aware that the
          signed data typically embeds the raw id token (OCMF ID field), so enabling
          the option persists raw tokens. May only become available when the
          transaction finishes, in which case it is completed at that point.
        type: object
        $ref: /units_signed#/SignedMeterValue
      signed_meter_value_stop:
        description: >-
          Signed meter value (e.g. an OCMF record) captured when the transaction
          finished, with the same config gate and raw-token caveat as
          signed_meter_value_start. Absent while the transaction is still running.
        type: object
        $ref: /units_signed#/SignedMeterValue
  Session:
    description: >-
      One persistently stored session record. A record is created when the session
      starts and completed when it finishes, so the fields that are only known at the
      end of a session are absent while the record is open.
    type: object
    additionalProperties: false
    required:
      - session_id
      - evse_id
      - evse_id_string
      - connector_id
      - state
      - timestamp_start
      - start_reason
    properties:
      session_id:
        description: >-
          The EVSE generated UUID of the session. A session contains at most one
          transaction, so this also identifies the transaction charged within it.
        type: string
      evse_id:
        description: >-
          The numeric id of the EVSE this session ran on, as used across EVerest
          interfaces (1-based)
        type: integer
        minimum: 1
        maximum: 128
      evse_id_string:
        description: >-
          The EVSEID of the EVSE this session ran on, as configured in the EvseManager.
          Empty if the EvseManager does not provide one.
        type: string
      connector_id:
        description: The id of the connector that was used for this session
        type: integer
        minimum: 1
      state:
        description: Lifecycle state of this record
        type: string
        $ref: /session_storage#/SessionState
      timestamp_start:
        description: Time the session started, in RFC3339 format
        type: string
        format: date-time
      timestamp_stop:
        description: >-
          Time the session finished, in RFC3339 format. Absent while the record is
          Open, and absent on Stale records.
        type: string
        format: date-time
      start_reason:
        description: Why this session was started
        type: string
        $ref: /evse_manager#/StartSessionReason
      transaction:
        description: >-
          The transaction charged within this session. Absent if the session never
          reached a transaction, for example when an EV was plugged in but never
          authorized.
        type: object
        $ref: /session_storage#/Transaction
      ocpp_transaction_id:
        description: >-
          The transaction id known to the CSMS, always as a string. Only present in
          OCPP setups: for OCPP 2.0.1 and 2.1 it is identical to session_id, for
          OCPP 1.6 it is the numeric id assigned by the CSMS in decimal notation,
          which arrives only after the transaction has already started. With early
          OCPP TxStartPoints an OCPP transaction can exist for a session that never
          reaches an EVerest transaction, so this may be present while transaction is
          absent.
        type: string
      ocpp_transaction_timestamp_start:
        description: >-
          Time the OCPP transaction started, in RFC3339 format, as reported in the
          transaction events of the OCPP module. It is the charging station clock at
          the OCPP transaction start and can differ from timestamp_start and from the
          timestamps of transaction, because the point at which an OCPP 2.x
          transaction starts is configurable via its TxStartPoint. Absent if no OCPP
          module is connected or the event was not received.
        type: string
        format: date-time
      ocpp_transaction_timestamp_stop:
        description: >-
          Time the OCPP transaction stopped, in RFC3339 format, as reported in the
          transaction events of the OCPP module. It is the charging station clock at
          the OCPP transaction stop and can differ from timestamp_stop and from the
          timestamps of transaction, because the point at which an OCPP 2.x
          transaction stops is configurable via its TxStopPoint. Absent if no OCPP
          module is connected or the event was not received.
        type: string
        format: date-time
      cost:
        description: >-
          Cost and tariff information reported for this session. Only present in setups
          where a cost source is connected, and all figures originate from the CSMS.
          The id_tag member is never populated, because the raw id token is not
          persisted.
        type: object
        $ref: /session_cost#/SessionCost
  SessionFilter:
    description: Criteria a session record must match to be returned
    type: object
    additionalProperties: false
    properties:
      state:
        description: Only records in this lifecycle state
        type: string
        $ref: /session_storage#/SessionState
      evse_id:
        description: Only records of the EVSE with this numeric id
        type: integer
        minimum: 1
        maximum: 128
      started_after:
        description: >-
          Only records whose session started strictly after this point in time,
          in RFC3339 format. Compared as an instant, so any UTC offset may be
          used. A value that is not a timestamp is ignored.
        type: string
        format: date-time
  GetSessionsRequest:
    description: >-
      Page request for stored session records. An empty object requests the first
      page of all records with the default page size.
    type: object
    additionalProperties: false
    properties:
      limit:
        description: >-
          Maximum number of records in the reply. The module may return fewer,
          and clamps the value to its supported maximum.
        type: integer
        minimum: 1
      continuation_token:
        description: >-
          Opaque token from a previous reply to continue the iteration. Omit to
          start from the oldest record. An invalid or outdated token starts the
          iteration from the beginning.
        type: string
      filter:
        description: Criteria the returned records must match
        type: object
        $ref: /session_storage#/SessionFilter
  SessionList:
    description: One page of stored session records
    type: object
    additionalProperties: false
    required:
      - sessions
    properties:
      sessions:
        description: >-
          The records of this page, in the order they were stored, oldest
          first. Empty if no more records match.
        type: array
        items:
          description: One stored session record
          type: object
          $ref: /session_storage#/Session
      continuation_token:
        description: >-
          Present if there may be more matching records. Pass it in the next
          request to continue the iteration; a reply without it means the
          iteration is complete.
        type: string
  SessionIdentifier:
    description: >-
      Identifies a single session record. Exactly one of the members must be set.
      If both are set, session_id takes precedence.
    type: object
    additionalProperties: false
    properties:
      session_id:
        description: The EVSE generated UUID of the session
        type: string
      ocpp_transaction_id:
        description: The transaction id known to the CSMS
        type: string
  SessionResult:
    description: >-
      Result of a single session record lookup. The session member is absent if no
      stored record matches the given identifier.
    type: object
    additionalProperties: false
    properties:
      session:
        description: The matching session record
        type: object
        $ref: /session_storage#/Session
  ClearSessionsResult:
    description: Result of deleting all stored session records
    type: object
    additionalProperties: false
    required:
      - cleared
    properties:
      cleared:
        description: Number of session records that were deleted
        type: integer
        minimum: 0
