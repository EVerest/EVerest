active_modules:
  energy_manager:
    module: EnergyManager
    config_module:
      update_interval: 1
      nominal_ac_voltage: 230.0
    connections:
      energy_trunk:
        - module_id: external_energy_node_api
          implementation_id: energy_grid
  external_energy_node_api:
    module: external_energy_node_API
    config_module:
      timeout_s: 2
      cfg_heartbeat_interval_ms: 0
      cfg_communication_check_to_s: 0
    connections:
      energy_consumer:
        - module_id: probe
          implementation_id: energy_consumer
  probe:
    module: ProbeModule
