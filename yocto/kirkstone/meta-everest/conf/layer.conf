BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-everest"
BBFILE_PATTERN_meta-everest = "^${LAYERDIR}/"

LAYERDEPENDS_meta-everest = "core meta-everest-common"
LAYERSERIES_COMPAT_meta-everest = "kirkstone"

# prefer version from recipes-backports
PREFERRED_VERSION_tpm2-openssl ??= "1.3%"

# Releases before styhead unpack into WORKDIR; the shared recipes refer to UNPACKDIR
UNPACKDIR ??= "${WORKDIR}"

# Add meta-everest-common from the EVerest tree unless bblayers.conf lists it, see
# meta-everest-common-auto.conf. An extensible SDK has no EVerest tree around its layers,
# its bblayers.conf lists meta-everest-common.
include ${LAYERDIR}/../../meta-everest-common/conf/meta-everest-common-auto.conf
