# Included by the layer.conf of every meta-everest layer, with LAYERDIR still pointing at
# that meta-everest layer. Adds this layer unless bblayers.conf lists it, recognized by
# this file whatever its directory is called. Tools parsing a layer.conf on its own have
# no BBLAYERS and get this layer as a dependency to provide.
require ${@'' if not d.getVar('BBLAYERS') or \
             any(os.path.isfile(os.path.join(l, 'conf', 'meta-everest-common-auto.conf')) \
                 for l in d.getVar('BBLAYERS').split()) \
           else 'meta-everest-common-add.conf'}
