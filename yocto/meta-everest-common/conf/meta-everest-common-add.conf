# Included by meta-everest-common-auto.conf, with LAYERDIR still pointing at the
# meta-everest layer that adds this layer.
EVEREST_COMMON_LAYERDIR := "${@os.path.normpath('${LAYERDIR}/../../meta-everest-common')}"

# bitbake has read BBLAYERS for parsing already; populate_sdk_ext reads it to decide
# which layers an extensible SDK gets, whose bblayers.conf then lists this layer.
BBLAYERS += "${EVEREST_COMMON_LAYERDIR}"

require ${EVEREST_COMMON_LAYERDIR}/conf/layer.conf
