# Recipes and classes shared by the meta-everest layers of all Yocto releases. A
# meta-everest layer adds this layer itself unless bblayers.conf lists it, see
# meta-everest-common-auto.conf.

# Set by meta-everest-common-add.conf when a meta-everest layer adds this layer
EVEREST_COMMON_LAYERDIR ?= "${LAYERDIR}"

BBPATH .= ":${EVEREST_COMMON_LAYERDIR}"
BBFILES += "${EVEREST_COMMON_LAYERDIR}/recipes-*/*/*.bb \
            ${EVEREST_COMMON_LAYERDIR}/recipes-*/*/*.bbappend"

# The layer priority makes a recipe of this layer win over an upstream one regardless
# of version. A release whose core layers ship a recipe themselves masks this one in
# its layer.conf, e.g.:
#   BBMASK += "/meta-everest-common/recipes-support/date/"

BBFILE_COLLECTIONS += "meta-everest-common"
BBFILE_PATTERN_meta-everest-common = "^${EVEREST_COMMON_LAYERDIR}/"

LAYERDEPENDS_meta-everest-common = "core"
LAYERSERIES_COMPAT_meta-everest-common = "kirkstone scarthgap wrynose"

EVEREST_CORE_PATH = "${EVEREST_COMMON_LAYERDIR}/../.."
EVEREST_CORE_PARENT_PATH = "${EVEREST_CORE_PATH}/.."
EVEREST_CORE_REPONAME ?= "${@os.path.basename(os.path.abspath(d.getVar("EVEREST_CORE_PATH")))}"
