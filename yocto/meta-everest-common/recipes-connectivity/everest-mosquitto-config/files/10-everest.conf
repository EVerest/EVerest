#
# Run mosquitto with the EVerest configuration instead of mosquitto.conf.
#
# mosquitto creates the socket with mode 0770 after dropping privileges to the
# user mosquitto. Mode 0750 on /run/mosquitto lets members of the group
# mosquitto, e.g. the user running EVerest, reach it and nobody else.
# mosquitto 2.1 manages /run/mosquitto as RuntimeDirectory, whose mode systemd
# re-applies before every command; mosquitto 2.0 creates it with mode 0740 in
# ExecStartPre.
[Service]
ExecStart=
ExecStart=@SBINDIR@/mosquitto -c @SYSCONFDIR@/mosquitto/everest.conf
RuntimeDirectoryMode=0750
ExecStartPre=/bin/chmod 0750 /run/mosquitto
