#
# EVerest internal communication over a Unix domain socket only, see
# /etc/everest/settings-mqtt-uds.yaml. All other topics are also reachable over
# TCP on localhost, the internal everest/ topics are not. mosquitto.service runs
# with this file instead of mosquitto.conf, see mosquitto.service.d/10-everest.conf.

per_listener_settings true

# Disable Nagle's algorithm for lower latency on the TCP listener. The option is
# global: mosquitto 2.0 also tries it on Unix domain socket connections and logs
# "Unable to set TCP_NODELAY" for each, which is harmless.
set_tcp_nodelay true

# EVerest manager and modules. Access is controlled by the permissions of
# /run/mosquitto, see mosquitto.service.d/10-everest.conf.
listener 0 /run/mosquitto/mosquitto.sock
allow_anonymous true

# Local clients, e.g. of the EVerest external topics, see everest-external.acl.
# Reaching them over the network needs authentication and TLS, see the
# security best practices in the EVerest documentation.
listener 1883 localhost
allow_anonymous true
acl_file /etc/mosquitto/everest-external.acl
