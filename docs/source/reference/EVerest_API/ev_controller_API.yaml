---
asyncapi: 3.0.0
id: 'pionix:de:everest:ev_controller_API'
info:
  title: 'EVerest API definition for the EV controller'
  version: 1.0.0
  description: >-
    API for EVerest API clients that drive an EvController, the simulated EV. The client configures
    and steers charging sessions and observes the EV's state, faults and ISO 15118 events.
    Plugging, unplugging and electrical faults are world operations of the paired EvDriverSim
    (ev_driver_sim API); EvController starts a session on pilot presence.
    Commands without arguments carry an empty JSON object ({}) as payload.
    A command whose payload the codec rejects, or that a state refuses, is acknowledged as Rejected
    on e2m/command_ack. A command that does not apply to the current state is ignored without an
    acknowledgement, for example resume_session, bcb_toggle and set_soc while Charging. Commands
    without arguments ignore their payload.

  license:
    name: Apache-2.0
    url: https://opensource.org/licenses/Apache-2.0
  tags:
    - name: EVerest
    - name: ev_controller
servers:
  default:
    pathname: 'everest_api/1/ev_controller/{module_id}'
    host: 'localhost:1883'
    description: default local MQTT
    protocol: mqtt
    variables:
      module_id:
        description: The ID of the module as defined in the EVerest config file.
defaultContentType: application/json


