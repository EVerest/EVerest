---
asyncapi: 3.0.0
id: 'pionix:de:everest:auth_token_provider_API'
info:
  title: 'EVerest API definition for auth token provider'
  version: 1.0.0
  description: >-
    API for EVerest API clients implementing auth token provider.

  license:
    name: Apache-2.0
    url: https://opensource.org/licenses/Apache-2.0
  tags:
    - name: EVerest
    - name: Auth
servers:
  default:
    pathname: 'everest_api/1/auth_token_provider/{module_id}'
    host: 'localhost:1883'
    description: default local MQTT
    protocol: mqtt
    variables:
      module_id:
        description: The ID of the module as defined in the EVerest config file.
defaultContentType: application/json


channels:
  send_provided_token:
    address: 'm2e/provided_token'
    messages:
      provided_token:
        $ref: '#/components/messages/send_provided_token'

  receive_heartbeat:
    address: 'e2m/heartbeat'
    messages:
      receive_heartbeat:
        $ref: '#/components/messages/receive_heartbeat'
  send_communication_check:
    address: 'm2e/communication_check'
    messages:
      send_communication_check:
        $ref: '#/components/messages/send_communication_check'



operations:
  send_provided_token:
    title: 'Send provided token'
    action: send
    channel:
      $ref: '#/channels/send_provided_token'
    description: 'Direction: Module to EVerest'

  receive_heartbeat:
    title: 'Receive heartbeat'
    action: receive
    channel:
      $ref: '#/channels/receive_heartbeat'
  send_communication_check:
    title: 'Send communication check'
    action: send
    channel:
      $ref: '#/channels/send_communication_check'



components:
  messages:
    send_provided_token:
      name: send_provided_token
      title: 'Send provided token'
      summary: 'The provided token'
      contentType: application/json
      payload:
        $ref: 'auth_consumer_API.yaml#/components/schemas/ProvidedIdToken'
      examples:
        - summary: "The Provided Token"
          payload:
            authorization_type: "OCPP"
            id_token:
              type: "Central"
              value: "TOKEN"

    receive_heartbeat:
      name: receive_heartbeat
      title: 'Receive heartbeat'
      summary: >-
        Heartbeat produced by EVerest every cfg_heartbeat_interval_ms from the moment the module is ready; the
        id starts at 0 and increases by 1 per message.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/HeartBeatId'
      examples:
        - summary: "Heartbeat"
          payload: 42

    send_communication_check:
      name: send_communication_check
      title: 'Send communication check'
      summary: Signal to EVerest that communication is good or check shall be stopped
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CommunicationCheck'
      examples:
        - summary: "CommunicationCheck"
          payload:
            true


  schemas:
    CommunicationCheck:
      type: boolean
      description: >-
        Send true at least every cfg_communication_check_to_s seconds to signal that the client is alive. Without
        it EVerest raises a CommunicationFault error on the API module, with sub_type "Initial communication check"
        when no true arrived within the first period after the module became ready (the heartbeat starts at
        the same moment) and "Bridge to implementation connection lost"
        after a later silence; the next true clears the fault. Send false to stop the check for the rest of the
        module's run: it clears an active CommunicationFault, no further fault is raised, and a later true does not
        start the check again; restart the module to re-enable it. Payloads other than a JSON boolean are ignored
        with a log warning and do not count as a check.
    HeartBeatId:
      type: integer
      description: >-
        64-bit unsigned integer. EVerest publishes the heartbeat every cfg_heartbeat_interval_ms (values <= 0
        disable it) from the moment the module is ready, which is also when the first communication check
        period starts. The first id is 0, every further heartbeat increases it by 1, and it wraps to 0 when the
        maximum representable value is reached. A client that connected later sees an arbitrary first id and
        should only rely on the increment and the period.
