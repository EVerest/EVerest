# The YAML half of the database-boot scenario's negative control. A boot from the
# database must never read this file, so the two undeclared keys below are named
# differently from the stored ones and must not appear in what that boot reports.
active_modules:
  module_a:
    module: TESTModuleA
    config_module:
      valid_module_config_entry: "test"
      a_key_the_manifest_does_not_declare: true
    config_implementation:
      main:
        valid_impl_config_entry: 42
        an_undeclared_impl_key: "surprise"
    connections:
      req1:
        - module_id: module_b
          implementation_id: impl1
  module_b:
    module: TESTModuleB
    config_module: {}
settings:
  interfaces_dir: "share/everest/interfaces"
  modules_dir: "libexec/everest/modules"
  types_dir: "share/everest/types"
  errors_dir: "share/everest/errors"
  schemas_dir: "share/everest/schemas"
  www_dir: "share/everest/www"
  logging_config_file: "etc/everest/default_logging.cfg"
