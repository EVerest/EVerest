# Test config where only a provided interface's config group carries a key
# `manifest.yaml` does not declare. The module's own group carries none, so the
# module level accessor must report nothing.
active_modules:
  example_0:
    module: RsExample
    config_implementation:
      foobar:
        an_undeclared_interface_key: true
    connections:
      a_friend:
        - module_id: example_1
          implementation_id: foobar
  example_1:
    module: RsExample
    connections:
      a_friend:
        - module_id: example_0
          implementation_id: foobar
