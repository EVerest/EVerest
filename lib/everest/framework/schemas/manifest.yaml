$schema: http://json-schema.org/draft-07/schema#
description: Json schema for EVerest manifest files
$defs:
  config_set_schema:
    type: object
    patternProperties:
      ^[a-zA-Z_][a-zA-Z0-9_.-]*$:
        type: object
        required:
          - type
          - description
        properties:
          type:
            type: string
            enum:
              - boolean
              - integer
              - number
              - string
          description:
            type: string
            minLength: 2
          mutability:
            type: string
            enum:
              - ReadOnly
              - ReadWrite
              - WriteOnly
            default: ReadOnly
        additionalProperties: true
    additionalProperties: false
    default: {}
  telemetry_element:
    description: >-
      A telemetry element published by this module. The kind decides the generated
      handle and how sinks can represent the element.
    type: object
    required:
      - kind
      - type
      - description
    properties:
      kind:
        type: string
        enum:
          - gauge
          - counter
          - state
          - event
      type:
        type: string
        enum:
          - number
          - integer
          - boolean
          - string
          - object
      description:
        type: string
        minLength: 2
      unit:
        description: Unit of a gauge or counter, spelled like OCPP UnitOfMeasure where OCPP defines it
        type: string
        enum:
          - A
          - ASU
          - B
          - Celsius
          - dB
          - dBm
          - Deg
          - Fahrenheit
          - h
          - Hz
          - K
          - kPa
          - kVA
          - kVAh
          - kvar
          - kvarh
          - kW
          - kWh
          - lx
          - m
          - min
          - ms
          - N
          - Ohm
          - Percent
          - RH
          - RPM
          - s
          - V
          - VA
          - VAh
          - var
          - varh
          - W
          - Wh
      enum:
        description: Inline enum values of a string state
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
    # "$ref" is matched as a pattern so that no schema tool mistakes it for a reference
    patternProperties:
      ^\$ref$:
        description: Reference to a string enum (state) or an object type (event) in types/
        type: string
        pattern: ^/[A-Za-z0-9_/-]+#/[A-Za-z_][A-Za-z0-9_]*$
      ^x-:
        description: Extension keys, ignored by tooling
    additionalProperties: false
    allOf:
      - if:
          required:
            - kind
          properties:
            kind:
              enum:
                - gauge
                - counter
        then:
          properties:
            type:
              enum:
                - number
                - integer
          not:
            anyOf:
              - required:
                  - enum
              - required:
                  - $ref
      - if:
          required:
            - kind
          properties:
            kind:
              const: state
        then:
          properties:
            type:
              enum:
                - boolean
                - string
          allOf:
            - not:
                required:
                  - unit
            - not:
                required:
                  - enum
                  - $ref
            - if:
                required:
                  - type
                properties:
                  type:
                    const: boolean
              then:
                not:
                  anyOf:
                    - required:
                        - enum
                    - required:
                        - $ref
      - if:
          required:
            - kind
          properties:
            kind:
              const: event
        then:
          required:
            - $ref
          properties:
            type:
              const: object
          not:
            anyOf:
              - required:
                  - unit
              - required:
                  - enum
type: object
required:
  - description
  - metadata
properties:
  description:
    type: string
    minLength: 2
  config:
    description: >-
      Config set for this module (and possibly default values) declared
      as json schema
    $ref: '#/$defs/config_set_schema'
  provides:
    description: >-
      this configures a list of implementations this module provides along
      with their api, provided vars and config
    type: object
    # at least one implementation is required
    minProperties: 1
    patternProperties:
      # arbitrary implementation id
      ^[a-zA-Z_][a-zA-Z0-9_.-]*$:
        description: This defines api, provided vars and config of this implementation
        type: object
        required:
          - description
          - interface
        # sadly the schema validates properties from "properties" against matching "patternProperties", too
        # --> we have to prevent this matching to not double validate against competing schemes
        patternProperties:
          # allow all sorts of additional properties that can be used to match requirements to
          ^(?!interface|config|cmds|vars$)[a-zA-Z_][a-zA-Z0-9_.-]*$:
            # only allow primitive types in here
            type:
              - string
              - integer
              - number
              - boolean
              - 'null'
        properties:
          description:
            type: string
            minLength: 2
          interface:
            description: this defines the interface to be implemented
            type: string
            pattern: ^[a-zA-Z_][a-zA-Z0-9_.-]*$
            minLength: 3
          config:
            description: >-
              Config set for this implementation (and possibly default
              values) declared as json schema
            $ref: '#/$defs/config_set_schema'
        additionalProperties: false
    # add empty provides if not already present
    default: {}
    # don't allow arbitrary additional properties
    additionalProperties: false
  requires:
    description: >-
      This describes a list of requirements that must be fulfilled by other
      modules. The key of this is an arbitrary requirement id that has to be referenced
      in the connections object by the main config, the values are a list of properties
      (key-value-pairs) the required module and implementations must have set in their
      provides section to fulfill this requirement
    type: object
    patternProperties:
      # requirement id
      ^[a-zA-Z_][a-zA-Z0-9_.-]*$:
        type: object
        required:
          - interface
        properties:
          interface:
            type: string
            pattern: ^[a-zA-Z_][a-zA-Z0-9_.-]*$
          min_connections:
            type: integer
            minimum: 0
            default: 1
          max_connections:
            type: integer
            minimum: 1
            default: 1
          # Used for now for the Rust bindings.
          ignore:
            type: object
            properties:
              vars:
                type:
                  - string
                  - array
                items:
                  type: string
                uniqueItems: true
              errors:
                type: boolean
                default: false
        # don't allow arbitrary additional properties
        additionalProperties: false
    # don't allow arbitrary additional properties
    additionalProperties: false
    default: {}
  metadata:
    description: this describes some metadata for this module
    type: object
    required:
      - license
      - authors
    properties:
      base_license:
        description: URI pointing to the base license of this module (e.g. https://opensource.org/licenses/Apache-2.0)
        type: string
        format: uri
      license:
        description: URI pointing to the license of this module (e.g. https://opensource.org/licenses/Apache-2.0)
        type: string
        format: uri
      authors:
        description: Author(s) of this module (an array of strings)
        type: array
        minItems: 1
        items:
          type: string
          minLength: 2
    # allow all sorts of additional properties
    additionalProperties: true
    default: {}
  enable_external_mqtt:
    description: this requests access to the external mqtt publishing interface
    type: boolean
    default: false
  enable_telemetry:
    description: this requests access to the telemetry publishing interface
    type: boolean
    default: false
  enable_global_errors:
    description: this requests access to the global error subscription interface
    type: boolean
    default: false
  capabilities:
    description: Linux capabilities required to run this module, e.g. "CAP_NET_RAW"
    type: array
    items:
      type: string
  telemetry:
    description: >-
      Telemetry elements published by this module, keyed by element name. ev-cli generates
      one typed handle per element (see lib/everest/framework/docs/Telemetry.md).
    type: object
    patternProperties:
      ^[a-z][a-z0-9_]{0,62}$:
        $ref: '#/$defs/telemetry_element'
    additionalProperties: false
    default: {}
  telemetry_receiver:
    description: >-
      Marks the module that receives all telemetry. When telemetry is enabled, the manager
      hands the telemetry socket to exactly one active module with this flag set.
    type: boolean
    default: false
additionalProperties: false
