$schema: http://json-schema.org/draft-07/schema#
description: Json schema for EVerest error objects
type: object
required:
  - type
  - sub_type
  - description
  - message
  - origin
  - vendor_id
  - severity
  - timestamp
  - uuid
  - state
properties:
  type:
    type: string
    minLength: 2
  sub_type:
    type: string
  description:
    type: string
    minLength: 2
  message:
    type: string
  origin:
    type: object
    required:
      - module_id
      - implementation_id
    properties:
      module_id:
        type: string
        minLength: 2
      implementation_id:
        type: string
        minLength: 2
      mapping:
        description: EVSE and connector the raising implementation is mapped to
        type: object
        required:
          - evse
        properties:
          evse:
            type: integer
          connector:
            type: integer
        additionalProperties: false
    additionalProperties: false
  vendor_id:
    type: string
  severity:
    type: string
    enum:
      - Low
      - Medium
      - High
  timestamp:
    type: string
    format: date-time
  uuid:
    type: string
    minLength: 2
  state:
    type: string
    enum:
      - Active
      - ClearedByModule
      - ClearedByReboot
  caused_by_value:
    description: Value that caused the error; absent when the raising entity named none
    type: object
    properties:
      actual_value:
        type: string
    additionalProperties: false
additionalProperties: false
