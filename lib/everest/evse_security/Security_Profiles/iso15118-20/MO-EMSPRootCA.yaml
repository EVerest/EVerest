header:
  domain_component: MO
  role: root


MO-EMSPRootCA:
  stand:
    - field: organization # Issuer Organization
      target: Issuer
      mustExist: "true"

    - field: commonName # Issuer Common Name
      target: Issuer
      mustExist: "true"

    - field: domainComponent # Issuer Domain Component
      target: Issuer
      mustExist: "true"
      val: "V2G

    - field: notBefore # Not Before
      target: Subject
      mustExist: "true"

    - field: notAfter # Not After
      target: Subject
      mustExist: "true"

    - field: organization # Subject Organization
      target: Subject
      mustExist: "true"

    - field: commonName # Subject Common Name
      target: Subject
      mustExist: "true"

    - field: domainComponent # Subject Domain Component
      target: Subject
      mustExist: "true"
      val: "MO"

    - field: subjectPublicKeyAlgorithm # Subject Public Key Algorithm Identifier
      target: Subject
      mustExist: "true"

    - field: subjectPublicKey # Subject Public Key
      target: Subject
      mustExist: "true"

    - field: issuerUniqueID # IssuerUniqueID
      target: Issuer
      mustExist: "false"

    - field: subjectUniqueID # SubjectUniqueID
      target: Subject
      mustExist: "false"

    - field: authorityKeyIdentifier # Authority Key Identifier
      target: Subject
      mustExist: "false"

    - field: authorityCertIssuer # Authority Cert Issuer
      target: Subject
      mustExist: "false"

    - field: authorityCertSerialNumber # Authority Cert Serial Number
      target: Subject
      mustExist: "false"

    - field: subjectKeyIdentifier # Subject Key Identifier
      target: Subject
      mustExist: "true"

    - field: keyUsage # Key Usage
      target: Subject
      mustExist: "true"
      critical: "true"

    - field: extendedKeyUsage # Extended Key Usage
      target: Subject
      mustExist: "false"

    - field: certificatePolicies # Certificate Policies
      target: Subject
      mustExist: "false"

    - field: basicConstraints # Basic Constraints
      target: Subject
      mustExist: "true"

    - field: crlDistributionPoints # CRL Distribution Point
      target: Subject
      mustExist: "false"

    - field: crlDistributionPointName # CRL Distribution Point Name
      target: Subject
      mustExist: "false"

    - field: authorityInfoAccess # Authority Info Access
      target: Subject
      mustExist: "false"

    - field: authorityInfoAccessMethod # Authority Info Access Method
      target: Subject
      mustExist: "false"

    - field: contractMobilityOperatorName # Contract Mobility Operator Name
      target: Subject
      mustExist: "false"

    - field: contractTariffName # Contract Tariff Name
      target: Subject
      mustExist: "false"

    - field: contractDynamicInformationUrl # Contract Dynamic Information Url
      target: Subject
      mustExist: "false"


  key_usage:
    - keyUsageBit: 0 # Digital Signature
      mustExist: "false"

    - keyUsageBit: 1 # Non Repudiation
      mustExist: "true"

    - keyUsageBit: 2 # Key Encipherment
      mustExist: "false"

    - keyUsageBit: 3 # Data Encipherment
      mustExist: "false"

    - keyUsageBit: 4 # Key Agreement
      mustExist: "false"

    - keyUsageBit: 5 # Encipher Only
      mustExist: "true"

    - keyUsageBit: 6 # Decipher Only
      mustExist: "true"

  basic_constraints:
    - value: CA
      mustExist: true
      data: true

    - value: path_length
      mustExist: false
      data: 0
