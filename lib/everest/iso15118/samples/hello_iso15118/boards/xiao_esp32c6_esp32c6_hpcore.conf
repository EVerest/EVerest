#
# Board-specific overrides for Seeed XIAO ESP32C6 (RISC-V "hpcore", the application core - see
# west build -b xiao_esp32c6/esp32c6/hpcore). The base prj.conf already builds and links here
# without any board-specific config (entropy is a real hardware RNG on this SoC, unlike e.g.
# qemu_cortex_m3 which has none and fails to link without one).
#
# This board has no Ethernet MAC, so its network transport for an ISO 15118 session is WiFi in
# station mode. main() associates with CONFIG_APP_WIFI_SSID at startup (see ../Kconfig and
# ../src/main.cpp) and then hands the "wlan0" interface to libiso15118.

# --- WiFi driver (ESP32-C6 is single-core RISC-V, so WIFI_ESP32's !SMP dependency is met).
# WIFI_ESP32 already selects NET_L2_WIFI_MGMT, NET_L2_ETHERNET, MBEDTLS and PSA_CRYPTO.
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y

# --- net_mgmt event delivery: needed for the NET_EVENT_WIFI_CONNECT_RESULT callback in main(),
# and INFO carries the association status code.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# --- IPv6 for ISO 15118. NET_IPV6 itself comes in via CONFIG_ISO15118 (POSIX_IPV6). SDP is
# link-local multicast only, so make sure DAD, MLD (to join ff02::x) and the neighbour cache
# are in, and leave room for link-local plus any global address the AP's router hands out.
CONFIG_NET_IPV6_DAD=y
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IF_MAX_IPV6_COUNT=3

# --- Heap. The ESP WiFi blob adds ~50K of its own (HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI);
# bump the shared pool above libiso15118's 32K default to cover it plus the D20 allocations.
CONFIG_HEAP_MEM_POOL_SIZE=131072

# --- Stacks. Zephyr's defaults (main 4K, sysworkq 1K, idle 512, ISR 2K) are far too small for
# libiso15118's C++ construction path (iostream logging, std::string/vector, exceptions) running
# on top of the ESP32 WiFi driver plus the IPv6/MLD/DAD net stack, which offloads work onto the
# system workqueue. With no stack guard on this config an overflow silently corrupts globals and
# faults somewhere unrelated, so keep generous headroom here.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=4096

# --- Packet buffers, sized for V2GTP/TLS-off session traffic.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# --- WiFi credentials. Override per checkout, e.g. via a board .conf fragment or
# `west build ... -- -DCONFIG_APP_WIFI_PSK=\"...\"`; do not commit real credentials.
CONFIG_APP_WIFI_SSID="changeme"
CONFIG_APP_WIFI_PSK=""

# --- Optional: `net iface` / `wifi` shell commands on the USB console for bring-up debugging.
# Drop these two lines to shrink the image once the link is proven.
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
