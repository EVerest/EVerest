version: "3.6"

services:
  mqtt-server:
    image: eclipse-mosquitto:2.0.10
    volumes:
      - type: bind
        source: ./mosquitto/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
    # mosquitto.conf's max_connections is only reachable if the process has the
    # descriptors to back it: one per client socket on top of the listeners. Docker's
    # default soft limit is 1024, which is below what the suites ask for.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Keep the broker's log. When a run fails because sessions stopped being
    # acknowledged, the only account of what the broker did is its own, and
    # `driver: none` threw it away.
    networks:
      - testnetwork

  e2e-test-server:
    image: integration-image
    depends_on:
      - mqtt-server
    environment:
      - MQTT_SERVER_ADDRESS=mqtt-server
    volumes:
      - type: bind
        source: ${GITHUB_WORKSPACE}
        target: /ext
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    networks:
      - testnetwork

networks:
  testnetwork:
    enable_ipv6: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "fd00:dead:beef::/64"