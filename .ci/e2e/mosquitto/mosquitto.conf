# The suites run one EVerest stack per xdist worker and every module of a stack holds its
# own session, so concurrent sessions scale with the runner's core count rather than with
# the test count. An OCPP round peaked at 389 live connections and stopped completing
# handshakes somewhere above 300. mosquitto's default is unlimited, which only means the
# process file-descriptor limit decides instead, so until now neither number was chosen.
# max_connections is a per-listener setting, hence once per listener. Raise this and the
# nofile ulimit in docker-compose.yaml together: neither is any use without the other.

# listener port-number [ip address/host name/unix socket path]
listener 1883
max_connections 2000

listener 9001
protocol websockets
max_connections 2000

allow_anonymous true
