# listener port-number [ip address/host name/unix socket path]
listener 1883


listener 9001
protocol websockets

allow_anonymous true

# Disable Nagle's algorithm on client sockets (mosquitto default: false).
# EVerest commands use QoS 2; with Nagle enabled, the broker holds the next
# small packet to a module until that module ACKs the trailing PUBCOMP/PUBACK,
# which the peer's delayed ACK postpones by up to ~40 ms per command call.
set_tcp_nodelay true
